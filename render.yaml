# Render Blueprint — WC Fantasy (Infrastructure-as-Code for the launch topology).
#
# Two vendors only: Render (compute) + Supabase (Postgres / Auth / Realtime) — DECISIONS.md "Architecture
# & Stack" (the prompt's "Theme E") §372. One repo, ONE build, three service shapes:
#   • web     — the Next.js app (UI + API routes, incl. the gated POST /api/draft/pick)
#   • worker  — the RESIDENT draft controller + ingestion scheduler (one process; ARCHITECTURE.md §2/§5)
#   • cron    — daily FAAB batch + hourly period-close (the two modes the worker EXTERNALIZES; roster
#               re-pull is self-scheduled in the worker via WORKER_ROSTERS_SYNC_EVERY_TICKS, so it is
#               NOT a cron — Theme G §522)
# The isolated Sofascore rating scraper was REMOVED (CODE_PROMPT_57); see the retired-service note below.
#
# ── Env contract (the load-bearing pooler split — DECISIONS.md §574–578) ──────────────────────────
#   DATABASE_URL = Supabase TRANSACTION pooler (PgBouncer, :6543) → app + worker RUNTIME.
#   DIRECT_URL   = Supabase SESSION pooler (:5432) → `prisma migrate deploy` ONLY (the txn pooler
#                  cannot carry migrations). Used by the web service `preDeployCommand`, once per release.
#   NEXT_PUBLIC_* are BUILD-TIME on web (inlined into the client bundle at `next build`, not read at
#                  runtime). They live INLINE on the web service for that reason.
#
# ── Secrets & the env group ───────────────────────────────────────────────────────────────────────
#   Every secret (the two pooler URLs, the Supabase keys, the BALLDONTLIE key) is `sync: false` — set
#   in the Render dashboard, NEVER committed. Render does NOT allow `sync: false` inside an env group
#   (group vars may only carry a literal `value`/`generateValue`), so the secret pooler URLs are
#   declared PER-SERVICE. The `wc-fantasy-shared` env group carries only the non-secret shared config
#   (NODE_ENV, LOG_LEVEL), entered once and inherited by every linked service.
#
# ── Region / plans ────────────────────────────────────────────────────────────────────────────────
#   Set `region` to match the Supabase project (runbook A1: "one region near the league"). `virginia`
#   (US-East) suits an America/New_York league on a US-East Supabase project — change as needed.
#   `plan: starter` sizes the documented ~$14 baseline (web + worker); the crons add cost — exact tiers
#   are a dashboard/billing choice (Sergio's).

envVarGroups:
  # Non-secret shared config only — Render forbids `sync: false` in a group, so the secret pooler URLs
  # live per-service below (NOT here). Entered once on the group, inherited by all linked services.
  - name: wc-fantasy-shared
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info

services:
  # ── Next.js app (UI + API routes, incl. the gated POST /api/draft/pick) ──────────────────────────
  - type: web
    name: wc-fantasy-web
    runtime: node
    plan: starter
    region: virginia
    branch: main
    # Explicit, ordered `prisma generate` before `next build` (not relying on the implicit postinstall
    # hook), split so a generate failure reports distinctly from a build failure.
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm db:generate && pnpm --filter @app/web build
    # Apply pending migrations ONCE per release, before the new version serves. `prisma migrate deploy`
    # reads the datasource `directUrl` (DIRECT_URL, :5432) — the txn pooler cannot carry migrations.
    preDeployCommand: pnpm db:migrate:deploy
    startCommand: pnpm --filter @app/web start
    healthCheckPath: /api/health
    envVars:
      - fromGroup: wc-fantasy-shared
      - key: DATABASE_URL # pooled (PgBouncer, Supabase :6543) — app runtime
        sync: false
      - key: DIRECT_URL # direct/session pooler (:5432) — Prisma Migrate (preDeployCommand)
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL # build-time — inlined into the client bundle at `next build`
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY # build-time — inlined
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY # server-only RUNTIME; bypasses RLS — NEVER NEXT_PUBLIC_ (guarded
        # by `import "server-only"` in lib/supabase/server.ts)
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_GOOGLE_ENABLED
        value: "false"
      # Web Push / VAPID (Prompt 41a). The PUBLIC key is build-time (inlined into the client bundle so
      # the browser can subscribe) AND read server-side by sendPush; the PRIVATE key + SUBJECT are
      # server-only runtime. Generate ONCE with `npx web-push generate-vapid-keys` and set in the Render
      # dashboard — NEVER commit the keypair. The SAME keypair must be set on the worker (for 41b).
      - key: NEXT_PUBLIC_VAPID_PUBLIC_KEY # build-time + server runtime — the application server key
        sync: false
      - key: VAPID_PRIVATE_KEY # server-only RUNTIME secret — signs the push (NEVER NEXT_PUBLIC_)
        sync: false
      - key: VAPID_SUBJECT # mailto:/https: contact URL (push-service contract), e.g. mailto:you@example.com
        sync: false
      - key: SITE_URL # public origin for server-side auth redirects (callback/sign-out). Non-secret.
        value: https://wc-fantasy-web.onrender.com

  # ── Background worker (RESIDENT): boots index.ts = ingestion scheduler AND the draft ticker ──────
  - type: worker
    name: wc-fantasy-worker
    runtime: node
    plan: starter
    region: virginia
    branch: main
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: pnpm --filter @app/worker start
    envVars:
      - fromGroup: wc-fantasy-shared
      - key: DATABASE_URL # pooled (:6543) — worker runtime + the provision/rosters one-shots
        sync: false
      - key: DIRECT_URL # also here so a `migrate deploy` / `provision` from the worker shell works
        sync: false
      # No Supabase keys here: the worker connects via Prisma as the table-owning role and BYPASSES RLS
      # (Theme F) — it never uses the anon/service-role key.
      - key: BALLDONTLIE_API_KEY
        sync: false
      - key: BALLDONTLIE_BASE_URL
        value: https://api.balldontlie.io
      - key: BALLDONTLIE_RPM # 600 = paid GOAT; 5 = the 48h trial
        value: "600"
      - key: WORKER_TICK_MS # ingestion scheduler cadence
        value: "60000"
      - key: WORKER_DRAFT_TICK_MS # draft clock — its own short cadence (server-authoritative timer)
        value: "2000"
      - key: WORKER_ROSTERS_SYNC_EVERY_TICKS # boot + ~daily roster re-pull, self-scheduled (no cron)
        value: "1440"
      # Playoff round AUTO-FIRE (feat/autofire-round-cut) — an UNATTENDED, IRREVERSIBLE cut+release on
      # PROVISIONAL scores. AUTOFIRE_CUTS_ENABLED is the master kill-switch: DEFAULT OFF (unset ⇒ the
      # scheduler's auto-fire step is a byte-identical no-op). sync:false so enabling it is a deliberate
      # dashboard toggle Sergio flips — NEVER committed on. AUTOFIRE_SETTLE_MIN is the minutes after a
      # round's last-FT proxy before the auto-cut fires (default 5).
      - key: AUTOFIRE_CUTS_ENABLED # master kill-switch — set "true" in the dashboard to enable auto-cuts
        sync: false
      - key: AUTOFIRE_SETTLE_MIN # settle window (minutes) after the round's last-FT proxy before firing
        value: "5"
      # Web Push / VAPID (Prompt 41a wiring; CONSUMED in 41b). The worker gains the @app/notify dep but
      # no behavior until the three triggers (draft-turn / player-not-starting / match-starting) land in
      # 41b — these vars are inert until then. Set the SAME keypair as the web service.
      - key: NEXT_PUBLIC_VAPID_PUBLIC_KEY # the application server key (sendPush setVapidDetails)
        sync: false
      - key: VAPID_PRIVATE_KEY # server-only RUNTIME secret — signs the push
        sync: false
      - key: VAPID_SUBJECT # mailto:/https: contact URL (push-service contract)
        sync: false

  # ── RETIRED: isolated Sofascore rating scraper (was `wc-fantasy-scraper`) ────────────────────────
  # The Sofascore scraper was REMOVED (CODE_PROMPT_57). It was structurally inert (AUDIT F-P2-03 — empty
  # Sofascore index, placeholder selector, unwired `notWiredLauncher`), so every rating already resolved
  # to the BALLDONTLIE `rating`, which is now the canonical rating source of record (resolver
  # `[manual, balldontlie]`; DECISIONS.md → Data source). `apps/scraper` + `packages/scrape` are deleted.
  # ⚠️ OPERATOR (Sergio, owns Render): removing the block here does NOT auto-delete the already-deployed
  # `wc-fantasy-scraper` worker service — delete/suspend it manually in the Render dashboard so it stops
  # trying to run the now-removed `pnpm --filter @app/scraper start`. (Mirrors the faab-batch note below.)

  # ── RETIRED: daily FAAB batch cron (was `wc-fantasy-faab-batch`) ─────────────────────────────────
  # The FAAB cadence is now ONE blind-bid batch per scoring period, cleared before that period's first
  # kickoff (DECISIONS.md → Theme D "per-matchday acquisition window" amendment). The trigger runs INSIDE
  # the Background Worker tick (apps/worker/src/faab/dispatch.ts), not on a separate daily cron, so this
  # cron service is removed. ⚠️ OPERATOR (Sergio, owns Render): removing the block here does NOT auto-
  # delete the already-deployed `wc-fantasy-faab-batch` cron service — delete/suspend it manually in the
  # Render dashboard so it stops invoking the now-removed `job:faab` script. The hourly period-close cron
  # below is UNCHANGED.

  # ── Cron: period-close check (plumbing live now; the freeze/close logic is a later prompt) ───────
  - type: cron
    name: wc-fantasy-period-close
    runtime: node
    plan: starter
    region: virginia
    branch: main
    # Hourly — stamp period.frozen_at ~result_freeze_hours after a wave's last FT (§2). Adjust as needed.
    schedule: "0 * * * *"
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: pnpm --filter @app/worker job:period-close
    envVars:
      - fromGroup: wc-fantasy-shared
      - key: DATABASE_URL # pooled (:6543) — runtime
        sync: false
      # A-lite cron-resilience DETECTION (DECISIONS.md "A-lite cron detection"): two best-effort,
      # env-gated, fire-and-forget observational pings from job:period-close. Both are PURELY
      # observational — an UNSET value = the signal is silently off and the job is byte-identical, so
      # they stay sync:false and Sergio sets the real monitor URLs per-service in the Render dashboard.
      #   • PERIOD_CLOSE_HEARTBEAT_URL — liveness dead-man's-switch ("it ran"); the job appends `/fail`
      #     on the crash path. Point at a Healthchecks.io-style check (~hourly period + ~15min grace).
      #     If a native Render "notify on cron failure" toggle is used instead, leave this UNSET.
      #   • PERIOD_CLOSE_ATTENTION_URL — pinged ONLY when a run reports anomalies (a postponed/abandoned
      #     fixture that may block the next round's status-open → run the runbook pre-flight). Point at a
      #     check/webhook that alerts on receipt, with dedup so a multi-day postponement doesn't spam.
      - key: PERIOD_CLOSE_HEARTBEAT_URL
        sync: false
      - key: PERIOD_CLOSE_ATTENTION_URL
        sync: false

  # ── Cron: group-standings refresh (T18 — game-detail Standings tab) ──────────────────────────────
  # Daily re-pull of the WC `group_standings` table so the Standings tab reflects the latest positions /
  # points. DISPLAY-ONLY / fantasy-safe: writes `group_standing` ONLY — no player dirty-mark, no
  # recompute (the scoring engine never reads this table). Idempotent (`team_id` upsert) — safe to re-run.
  # PRIMARILY needed during the group stage; ⚠️ OPERATOR (Sergio, owns Render): may suspend this cron once
  # the group stage is complete (knockouts have no group table). Mirrors the period-close cron, plus the
  # BALLDONTLIE feed key (per-service, sync:false) since this job hits the feed like the worker.
  - type: cron
    name: wc-fantasy-group-standings
    runtime: node
    plan: starter
    region: virginia
    branch: main
    # 07:20 UTC daily — after the prior day's group fixtures have settled. Off the exact hour on purpose.
    schedule: "20 7 * * *"
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: pnpm --filter @app/worker job:ingest-group-standings
    envVars:
      - fromGroup: wc-fantasy-shared
      - key: DATABASE_URL # pooled (:6543) — runtime
        sync: false
      - key: BALLDONTLIE_API_KEY
        sync: false
      - key: BALLDONTLIE_BASE_URL
        value: https://api.balldontlie.io
      - key: BALLDONTLIE_RPM
        value: "600"
