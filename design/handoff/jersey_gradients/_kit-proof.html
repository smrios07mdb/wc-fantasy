<!doctype html><html><head><meta charset="utf-8"><title>Jersey kit proof — 30 nations</title>
<style>
  :root{ --surface-4:#3a3f47; --kit-outline:rgba(255,255,255,.85); }
  body{ margin:0; background:#11151C; color:#cdd6e4;
        font:13px/1.3 -apple-system,Helvetica,Arial,sans-serif; padding:28px; }
  h1{ font-size:15px; font-weight:600; color:#fff; margin:0 0 4px; }
  p.sub{ margin:0 0 22px; color:#8b95a7; font-size:12px; }
  .grid{ display:grid; grid-template-columns:repeat(6,1fr); gap:20px 14px; }
  .cell{ margin:0; display:flex; flex-direction:column; align-items:center; gap:7px; text-align:center; }
  .jersey{ width:32px; height:32px; border-radius:6px; background:var(--surface-4);
           background-repeat:no-repeat; box-shadow:inset 0 0 0 1px var(--kit-outline); }
  figcaption{ font-size:11px; color:#aeb7c6; max-width:78px; }
  .cell.miss figcaption{ color:#ff6b6b; font-weight:600; }
</style></head>
<body>
  <h1>Vs-the-Field jersey kits — kitOf() over all 30 in-scope nations</h1>
  <p class="sub">32px tokens on #11151C. Any grey token (or ⚠ FALLBACK) = a silent resolution miss.</p>
  <div class="grid">
<figure class="cell">
      <span class="jersey" style="background:radial-gradient(circle at 50% 50%,#F4B32E 0 7%,transparent 7.6%), linear-gradient(180deg,#75AADB 0 33.33%,#fff 33.33% 66.66%,#75AADB 66.66%)"></span>
      <figcaption>Argentina</figcaption>
    </figure>
<figure class="cell">
      <span class="jersey" style="background:linear-gradient(90deg,#006847 0 33.33%,#fff 33.33% 66.66%,#CE1126 66.66%)"></span>
      <figcaption>Mexico</figcaption>
    </figure>
<figure class="cell">
      <span class="jersey" style="background:linear-gradient(90deg,#0055A4 0 33.33%,#fff 33.33% 66.66%,#EF4135 66.66%)"></span>
      <figcaption>France</figcaption>
    </figure>
<figure class="cell">
      <span class="jersey" style="background:conic-gradient(from 0deg at 50% 50%,#D81E05 0 25%,#fff 0 50%,#D81E05 0 75%,#fff 0) 50% 30%/22% 22% no-repeat, linear-gradient(180deg,#FF0000 0 33.33%,#fff 33.33% 66.66%,#171796 66.66%)"></span>
      <figcaption>Croatia</figcaption>
    </figure>
<figure class="cell">
      <span class="jersey" style="background:linear-gradient(#3C3B6E,#3C3B6E) top left/44% 54% no-repeat, repeating-linear-gradient(180deg,#B22234 0 7.7%, #fff 7.7% 15.4%)"></span>
      <figcaption>United States</figcaption>
    </figure>
<figure class="cell">
      <span class="jersey" style="background:radial-gradient(circle at 50% 50%,#002776 0 12%,transparent 12.6%), radial-gradient(circle at 50% 50%,#FFDF00 0 32%,transparent 32.6%), #009C3B"></span>
      <figcaption>Brazil</figcaption>
    </figure>
<figure class="cell">
      <span class="jersey" style="background:radial-gradient(circle at 50% 50%,#FFE400 0 7%,transparent 7.6%), linear-gradient(90deg,#006600 0 50%,#FF0000 50%)"></span>
      <figcaption>Portugal</figcaption>
    </figure>
<figure class="cell">
      <span class="jersey" style="background:linear-gradient(#CF142B,#CF142B) 50% 0/22% 100% no-repeat,linear-gradient(#CF142B,#CF142B) 0 50%/100% 22% no-repeat,#fff"></span>
      <figcaption>England</figcaption>
    </figure>
<figure class="cell">
      <span class="jersey" style="background:radial-gradient(circle at 22% 23%,#F4B32E 0 9%,transparent 9.6%), linear-gradient(#fff,#fff) top left/42% 46% no-repeat, repeating-linear-gradient(180deg,#4F86C6 0 12.5%,#fff 12.5% 25%)"></span>
      <figcaption>Uruguay</figcaption>
    </figure>
<figure class="cell">
      <span class="jersey" style="background:linear-gradient(90deg,#1A1A1A 0 33.33%,#FAE042 33.33% 66.66%,#ED2939 66.66%)"></span>
      <figcaption>Belgium</figcaption>
    </figure>
<figure class="cell">
      <span class="jersey" style="background:linear-gradient(90deg,#F77F00 0 33.33%,#fff 33.33% 66.66%,#009E60 66.66%)"></span>
      <figcaption>Côte d'Ivoire</figcaption>
    </figure>
<figure class="cell">
      <span class="jersey" style="background:radial-gradient(circle at 50% 50%,#00853F 0 7%,transparent 7.6%), linear-gradient(90deg,#00853F 0 33.33%,#FDEF42 33.33% 66.66%,#E31B23 66.66%)"></span>
      <figcaption>Senegal</figcaption>
    </figure>
<figure class="cell">
      <span class="jersey" style="background:linear-gradient(180deg,#1A1A1A 0 33.33%,#DD0000 33.33% 66.66%,#FFCE00 66.66%)"></span>
      <figcaption>Germany</figcaption>
    </figure>
<figure class="cell">
      <span class="jersey" style="background:linear-gradient(180deg,#CE1126 0 33.33%,#fff 33.33% 66.66%,#1A1A1A 66.66%)"></span>
      <figcaption>Egypt</figcaption>
    </figure>
<figure class="cell">
      <span class="jersey" style="background:linear-gradient(180deg,#AE1C28 0 33.33%,#fff 33.33% 66.66%,#21468B 66.66%)"></span>
      <figcaption>Netherlands</figcaption>
    </figure>
<figure class="cell">
      <span class="jersey" style="background:radial-gradient(circle at 50% 50%,#1A1A1A 0 8%,transparent 8.6%), linear-gradient(180deg,#CE1126 0 33.33%,#FCD116 33.33% 66.66%,#006B3F 66.66%)"></span>
      <figcaption>Ghana</figcaption>
    </figure>
<figure class="cell">
      <span class="jersey" style="background:linear-gradient(180deg,#AA151B 0 25%,#F1BF00 25% 75%,#AA151B 75%)"></span>
      <figcaption>Spain</figcaption>
    </figure>
<figure class="cell">
      <span class="jersey" style="background:linear-gradient(180deg,#FCD116 0 50%,#003893 50% 75%,#CE1126 75%)"></span>
      <figcaption>Colombia</figcaption>
    </figure>
<figure class="cell">
      <span class="jersey" style="background:radial-gradient(circle at 50% 42%,#7A5C2E 0 9%,transparent 9.6%), linear-gradient(180deg,#FFD100 0 50%,#034EA2 50% 75%,#ED1C24 75%)"></span>
      <figcaption>Ecuador</figcaption>
    </figure>
<figure class="cell">
      <span class="jersey" style="background:linear-gradient(180deg,#C8102E 0 33.33%,#fff 33.33% 66.66%,#C8102E 66.66%)"></span>
      <figcaption>Austria</figcaption>
    </figure>
<figure class="cell">
      <span class="jersey" style="background:radial-gradient(circle at 50% 50%,#D52B1E 0 11%,transparent 11.6%), linear-gradient(90deg,#D52B1E 0 28%,#fff 28% 72%,#D52B1E 72%)"></span>
      <figcaption>Canada</figcaption>
    </figure>
<figure class="cell">
      <span class="jersey" style="background:linear-gradient(#fff,#fff) 50% 50%/64% 30% no-repeat, linear-gradient(#fff,#fff) 50% 50%/30% 64% no-repeat, #DA291C"></span>
      <figcaption>Switzerland</figcaption>
    </figure>
<figure class="cell">
      <span class="jersey" style="background:radial-gradient(circle at 50% 50%,#BC002D 0 23%,transparent 23.6%), #fff"></span>
      <figcaption>Japan</figcaption>
    </figure>
<figure class="cell">
      <span class="jersey" style="background:radial-gradient(circle at 40% 50%,#fff 0 17%,transparent 17.6%), #E30A17"></span>
      <figcaption>Türkiye</figcaption>
    </figure>
<figure class="cell">
      <span class="jersey" style="background:radial-gradient(circle at 50% 50%,#006233 0 19%,transparent 19.6%), #C1272D"></span>
      <figcaption>Morocco</figcaption>
    </figure>
<figure class="cell">
      <span class="jersey" style="background:radial-gradient(circle at 50% 50%,#CD2E3A 0 12%,#0047A0 12% 23%,transparent 23.6%), #fff"></span>
      <figcaption>South Korea</figcaption>
    </figure>
<figure class="cell">
      <span class="jersey" style="background:linear-gradient(#FECC00,#FECC00) 34% 0/16% 100% no-repeat, linear-gradient(#FECC00,#FECC00) 0 50%/100% 30% no-repeat, #006AA7"></span>
      <figcaption>Sweden</figcaption>
    </figure>
<figure class="cell">
      <span class="jersey" style="background:linear-gradient(#00205B,#00205B) 34% 0/8% 100% no-repeat, linear-gradient(#00205B,#00205B) 0 50%/100% 15% no-repeat, linear-gradient(#fff,#fff) 34% 0/18% 100% no-repeat, linear-gradient(#fff,#fff) 0 50%/100% 34% no-repeat, #BA0C2F"></span>
      <figcaption>Norway</figcaption>
    </figure>
<figure class="cell">
      <span class="jersey" style="background:linear-gradient(45deg,transparent 43%,#fff 43% 57%,transparent 57%), linear-gradient(135deg,transparent 43%,#fff 43% 57%,transparent 57%), #0065BF"></span>
      <figcaption>Scotland</figcaption>
    </figure>
<figure class="cell">
      <span class="jersey" style="background:linear-gradient(135deg,#11457E 0 38%,transparent 38%), linear-gradient(180deg,#fff 0 50%,#D7141A 50%)"></span>
      <figcaption>Czechia</figcaption>
    </figure>
  </div>
</body></html>
