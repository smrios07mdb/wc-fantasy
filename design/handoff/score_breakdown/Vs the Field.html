<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="cobalt" data-density="compact">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XI · Vs the Field</title>
<link rel="icon" type="image/png" sizes="32x32" href="logo/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="logo/icons/favicon-16.png">
<link rel="apple-touch-icon" href="logo/icons/apple-touch-icon.png">
<link rel="manifest" href="logo/icons/site.webmanifest">
<meta name="theme-color" content="#0A0D12">
<link rel="stylesheet" href="ds/ds.css">
<style>
  html,body{ height:100%; }
  body{ background:var(--surface-0); }
  #root{ min-height:100vh; }
  /* Gold removed across this surface — refine the two amber DS tokens locally.
     (Flagged: --pos-gk is a shared token also used on the approved Draft Room.) */
  :root{ --pos-gk:#5E6E8C; --node-played:#6E86B4; }
  .pos-GK{ color:var(--text-primary); }
  ::-webkit-scrollbar{ width:10px; height:10px; } ::-webkit-scrollbar-thumb{ background:var(--surface-4); border-radius:10px; border:2px solid var(--surface-1);} 

  /* ============================ STAGE (presenter chrome) ============================ */
  .vf-stage{ min-height:100vh; display:flex; flex-direction:column; padding:14px 16px 28px; gap:12px; }
  .vf-logo{ width:28px;height:28px;border-radius:7px;background:#0A0D12 url('logo/icon-tile.png') center/cover no-repeat;color:transparent;font-size:0;flex:none;box-shadow:inset 0 0 0 1px var(--hairline); }
  .vf-stagebar{ display:flex; align-items:center; gap:18px; flex-wrap:wrap; background:var(--surface-1); border:1px solid var(--hairline); border-radius:var(--r-lg); padding:10px 14px; }
  .vf-sb-title{ display:flex; align-items:center; gap:10px; }
  .vf-sb-sim{ display:flex; align-items:center; gap:10px; flex:1; min-width:320px; }
  .vf-sb-clock{ font-weight:700; font-size:15px; white-space:nowrap; }
  .vf-sb-range{ flex:1; min-width:120px; accent-color:var(--accent); height:4px; }
  .vf-sb-jumps{ display:flex; gap:6px; }
  .vf-sb-conn{ display:flex; align-items:center; gap:4px; }
  .vf-connbtn{ border:1px solid var(--hairline); background:var(--surface-2); color:var(--text-secondary); font:600 11px/1 var(--font-sans); padding:6px 9px; border-radius:var(--r-sm); cursor:pointer; text-transform:capitalize; }
  .vf-connbtn.is-active{ background:var(--accent-soft); border-color:var(--accent); color:var(--text-primary); }

  .vf-legendbar{ display:flex; align-items:center; gap:18px; flex-wrap:wrap; padding:0 4px; }
  .vf-leg{ display:inline-flex; align-items:center; gap:6px; font-size:var(--fs-caption); color:var(--text-secondary); white-space:nowrap; }
  .vf-leg i{ width:10px; height:10px; border-radius:50%; flex:none; }
  .vf-leg-final i{ background:var(--node-played); } .vf-leg-live i{ background:var(--live); } .vf-leg-ytp i{ background:transparent; border:1.5px solid var(--text-tertiary); }

  /* fit-scaled frame row */
  .vf-fit{ flex:1; display:flex; justify-content:center; }
  .vf-frames{ display:flex; gap:28px; align-items:flex-start; transform-origin:top center; flex:none; }

  /* browser window chrome */
  .vf-browser{ width:1180px; height:808px; border-radius:14px; overflow:hidden; background:var(--surface-1); border:1px solid var(--hairline-strong); box-shadow:var(--e3); display:flex; flex-direction:column; }
  .vf-bw-bar{ height:40px; flex:none; display:flex; align-items:center; gap:8px; padding:0 14px; background:var(--surface-2); border-bottom:1px solid var(--hairline); }
  .vf-bw-dot{ width:11px; height:11px; border-radius:50%; }
  .vf-bw-url{ display:flex; align-items:center; gap:6px; margin-left:10px; background:var(--surface-0); border:1px solid var(--hairline); border-radius:var(--r-pill); padding:5px 12px; font-size:12px; color:var(--text-secondary); }
  .vf-bw-badge{ margin-left:auto; color:var(--text-tertiary); letter-spacing:.04em; }
  .vf-bw-body{ flex:1; min-height:0; }

  /* phone wrapper */
  .vf-phone{ position:relative; flex:none; }
  .vf-phone-badge{ position:absolute; left:50%; bottom:-22px; transform:translateX(-50%); color:var(--text-tertiary); letter-spacing:.04em; white-space:nowrap; }

  /* ============================ DESKTOP APP ============================ */
  .vf-app{ height:100%; display:flex; flex-direction:column; background:var(--surface-0); position:relative; }
  .vf-top{ display:flex; align-items:center; gap:16px; padding:12px 18px; border-bottom:1px solid var(--hairline); background:var(--surface-1); flex:none; }
  .vf-brand{ display:flex; align-items:center; gap:10px; }
  .vf-brand-title{ font-weight:800; font-size:17px; line-height:1; }
  .vf-viewtabs{ }
  .vf-top-right{ display:flex; align-items:center; gap:12px; }

  .vf-banner{ display:flex; align-items:center; gap:8px; padding:8px 18px; font-size:var(--fs-sm); flex:none; }
  .vf-banner-recon{ background:var(--info-soft); color:var(--text-primary); }
  .vf-banner-stale{ background:var(--surface-2); color:var(--text-secondary); border-bottom:1px solid var(--hairline); }
  .vf-banner-empty{ background:var(--surface-2); color:var(--text-secondary); border-bottom:1px solid var(--hairline); }

  .vf-body{ flex:1; min-height:0; display:flex; }
  .vf-main{ flex:1; min-width:0; overflow-y:auto; padding:14px 16px; }
  .vf-rail{ width:372px; flex:none; border-left:1px solid var(--hairline); background:var(--surface-1); overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:14px; }
  .vf-scroll{ flex:1; min-height:0; overflow-y:auto; padding:18px; }

  /* match strip */
  .vf-matchstrip{ display:flex; align-items:center; gap:10px; padding:10px 16px; border-bottom:1px solid var(--hairline); background:var(--surface-1); flex:none; }
  .vf-matchstrip-scroll{ display:flex; gap:8px; overflow-x:auto; flex:1; padding-bottom:2px; }
  .vf-match{ display:flex; flex-direction:column; gap:4px; min-width:148px; padding:7px 10px; background:var(--surface-2); border:1px solid var(--hairline); border-radius:var(--r-md); cursor:pointer; text-align:left; flex:none; color:var(--text-primary); transition:border-color var(--dur-fast), box-shadow var(--dur-fast); }
  .vf-match:hover{ background:var(--surface-3); }
  .vf-match.is-active{ border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
  .vf-match-clock{ display:inline-flex; align-items:center; gap:5px; font:700 10px/1 var(--font-mono); letter-spacing:.04em; text-transform:uppercase; }
  .vf-match-clock.is-live{ color:var(--live); } .vf-match-clock.is-final{ color:var(--locked); } .vf-match-clock.is-ytp{ color:var(--text-tertiary); }
  .vf-match-teams{ display:flex; align-items:center; gap:8px; }
  .vf-mt{ display:flex; align-items:center; gap:5px; font-size:var(--fs-sm); }
  .vf-match-score{ font-weight:700; margin-left:auto; }

  /* field table */
  .vf-table{ }
  .vf-thead, .vf-row{ display:grid; grid-template-columns:34px 228px 56px minmax(150px,1fr) 86px 80px; align-items:center; gap:10px; }
  .vf-thead{ padding:6px 12px; border-bottom:1px solid var(--hairline); }
  .vf-thead > div{ font:700 var(--fs-micro)/1 var(--font-sans); letter-spacing:.06em; text-transform:uppercase; color:var(--text-tertiary); }
  .vf-thead .vf-c-rank, .vf-thead .vf-c-xi, .vf-thead .vf-c-ytp{ text-align:center; }
  .vf-tbody{ }
  .vf-row{ padding:9px 12px; border-bottom:1px solid var(--hairline); cursor:pointer; transition:background var(--dur-fast); border-radius:var(--r-sm); }
  .vf-row:hover{ background:var(--surface-2); }
  .vf-row.is-me{ background:var(--accent-soft); box-shadow:inset 3px 0 0 var(--accent); }
  .vf-row.is-selected{ background:var(--surface-3); box-shadow:inset 3px 0 0 var(--text-tertiary); }
  .vf-row.is-me.is-selected{ box-shadow:inset 3px 0 0 var(--accent); }
  .vf-c-rank{ color:var(--text-tertiary); font-size:var(--fs-sm); text-align:center; }
  .vf-c-mgr{ display:flex; align-items:center; gap:9px; min-width:0; }
  .vf-mgr-name{ display:flex; flex-direction:column; min-width:0; flex:1; }
  .vf-mgr-name b{ font-size:var(--fs-sm); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .vf-mgr-name span{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .vf-c-score{ text-align:left; font-weight:800; font-size:20px; }
  .vf-c-xi{ display:flex; justify-content:center; align-items:center; }
  .vf-c-ytp{ display:flex; flex-direction:column; align-items:center; gap:1px; }
  .vf-ytp-num{ font-weight:700; font-size:21px; line-height:1; color:var(--text-primary); font-family:var(--font-display); }
  .vf-ytp-lab{ font-size:9px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-tertiary); white-space:nowrap; line-height:1.1; }
  .vf-live-mini{ display:inline-flex; align-items:center; gap:4px; font-size:var(--fs-micro); font-weight:700; color:var(--live); margin-top:3px; white-space:nowrap; }
  .vf-live-mini.is-dim{ opacity:.4; filter:grayscale(.4); }
  .vf-c-h2h{ display:flex; justify-content:flex-start; }

  /* XI formation pitch — the lineup's shape; nodes lit by live state. No gold anywhere. */
  .vf-pitch{ position:relative; display:flex; overflow:hidden; border:1px solid var(--hairline);
    border-radius:8px; background:linear-gradient(180deg, color-mix(in srgb,var(--pitch-2) 26%, var(--surface-1)), color-mix(in srgb,var(--pitch-2) 13%, var(--surface-1))); }
  .vf-pitch::after{ content:''; position:absolute; left:50%; top:50%; width:20%; aspect-ratio:1; transform:translate(-50%,-50%); border:1px solid rgba(255,255,255,.05); border-radius:50%; pointer-events:none; }
  .vf-pitch-v::before{ content:''; position:absolute; left:10%; right:10%; top:50%; height:1px; background:rgba(255,255,255,.05); }
  .vf-pitch-h::before{ content:''; position:absolute; top:12%; bottom:12%; left:50%; width:1px; background:rgba(255,255,255,.05); }
  .vf-pitch-v{ flex-direction:column; } .vf-pitch-h{ flex-direction:row; }
  .vf-lane{ display:flex; flex:1; align-items:center; justify-content:space-evenly; min-width:0; }
  .vf-pitch-v .vf-lane{ flex-direction:row; } .vf-pitch-h .vf-lane{ flex-direction:column; }
  .vf-node{ border-radius:50%; flex:none; }
  .vf-node.s-final{ background:var(--node-played); }
  .vf-node.s-live{ background:var(--live); box-shadow:0 0 0 3px var(--live-soft); }
  .vf-node.s-ytp{ background:transparent; border:1.5px solid var(--text-tertiary); }
  /* sizes */
  .vf-pitch-table{ width:100%; max-width:200px; height:66px; padding:7px 13px; }
  .vf-pitch-table .vf-node{ width:8.5px; height:8.5px; } .vf-pitch-table .vf-node.s-live{ box-shadow:0 0 0 2.5px var(--live-soft); }
  .vf-pitch-hero{ width:100%; height:168px; padding:16px 20px; }
  .vf-pitch-hero .vf-node{ width:14px; height:14px; }
  .vf-pitch-mob{ width:100%; height:142px; padding:13px 18px; }
  .vf-pitch-mob .vf-node{ width:12px; height:12px; }
  .vf-pitch-inline{ width:74px; height:42px; padding:4px 6px; } .vf-pitch-inline .vf-node{ width:6px; height:6px; }
  .vf-pitch-inline::after, .vf-pitch-inline::before{ display:none; }
  /* gentle "lit" pulse only on the larger pitches (restraint: tables stay still) */
  .vf-pitch-hero .vf-node.s-live, .vf-pitch-mob .vf-node.s-live{ animation:nodepulse 2.6s var(--ease-standard) infinite; }
  @keyframes nodepulse{ 0%,100%{ box-shadow:0 0 0 3px var(--live-soft);} 50%{ box-shadow:0 0 0 6px transparent;} }
  /* legend */
  .vf-legend2{ display:flex; gap:16px; flex-wrap:wrap; }
  .vf-l2{ display:inline-flex; align-items:center; gap:7px; font-size:var(--fs-caption); color:var(--text-secondary); white-space:nowrap; }
  .vf-l2 .vf-node{ width:9px; height:9px; }
  /* status pills — gold-free */
  .vf-pill-toplay{ background:transparent; border:1px solid var(--hairline-strong); color:var(--text-secondary); }
  .vf-pill-toplay .vf-node{ width:7px; height:7px; }
  .vf-pill-played{ background:var(--surface-3); color:var(--text-tertiary); }

  /* live dot */
  .vf-livedot{ width:6px; height:6px; border-radius:50%; background:var(--live); animation:livepulse 1.4s var(--ease-standard) infinite; flex:none; }
  .vf-pill-mini{ height:18px; padding:0 6px; font-size:9px; }
  .vf-pill-mini svg{ width:9px; height:9px; }

  /* record badge */
  .vf-recbadge{ flex:none; }
  .vf-rec-nums{ display:flex; align-items:baseline; gap:2px; font-family:var(--font-display); font-weight:800; line-height:1; letter-spacing:-.02em; }
  .vf-recbadge-lg .vf-rec-nums{ font-size:44px; } .vf-recbadge-sm .vf-rec-nums{ font-size:30px; }
  .vf-rec-w{ color:var(--win); } .vf-rec-l{ color:var(--loss); } .vf-rec-dash{ color:var(--text-tertiary); } .vf-rec-d{ color:var(--draw); font-size:.6em; }
  .vf-rec-cap{ font-size:var(--fs-caption); font-weight:600; margin-top:3px; }
  .vf-rec-win{ color:var(--win); } .vf-rec-loss{ color:var(--loss); } .vf-rec-draw{ color:var(--draw); }

  /* H2H result chip */
  .vf-h2h{ display:inline-flex; align-items:center; gap:5px; }
  .vf-h2h-margin{ font-size:var(--fs-caption); font-weight:700; color:var(--text-tertiary); }
  .vf-h2h-margin.is-up{ color:var(--win); } .vf-h2h-margin.is-down{ color:var(--loss); }

  /* ===== You-vs-field hero (calm, hairline-sectioned) ===== */
  .vf-hero{ padding:18px; display:flex; flex-direction:column; }
  .vf-hero > .t-label{ margin-bottom:14px; }
  .vf-hero-sec{ padding:15px 0; border-top:1px solid var(--hairline); }
  .vf-hero-sec.first{ border-top:none; padding-top:0; }
  .vf-hero-sec.last{ padding-bottom:0; }
  .vf-hero-headline{ display:flex; align-items:flex-end; justify-content:space-between; }
  .vf-hero-score-num{ font-size:46px; font-weight:800; line-height:.85; }
  .vf-hero-score-lab{ display:block; font-size:var(--fs-caption); color:var(--text-tertiary); margin-top:8px; }
  .vf-hero-rankchip{ text-align:right; white-space:nowrap; }
  .vf-hero-rank-num{ font-size:30px; font-weight:800; line-height:1; color:var(--text-primary); }
  .vf-hero-rank-sub{ display:block; font-size:var(--fs-caption); color:var(--text-tertiary); margin-top:4px; }
  .vf-hero-recsec{ display:flex; align-items:center; gap:16px; }
  .vf-hero-recnote{ margin:0; }
  .vf-tocome{ display:flex; align-items:center; gap:13px; margin-bottom:13px; }
  .vf-tocome-num{ font-size:40px; font-weight:800; line-height:1; color:var(--text-primary); }
  .vf-tocome-txt{ display:flex; flex-direction:column; gap:2px; }
  .vf-tocome-txt b{ font-size:var(--fs-body); }
  .vf-tocome-txt span{ font-size:var(--fs-caption); color:var(--text-tertiary); }
  .vf-hero-pitchsec{ display:flex; gap:16px; align-items:stretch; }
  .vf-pitch-side{ display:flex; flex-direction:column; justify-content:center; gap:15px; flex:none; width:92px; }
  .vf-ps-stat{ display:flex; flex-direction:column; gap:1px; }
  .vf-ps-num{ font-family:var(--font-display); font-size:25px; font-weight:800; line-height:1; letter-spacing:-.02em; }
  .vf-ps-num.is-live{ color:var(--live); }
  .vf-ps-lab{ font-size:var(--fs-caption); color:var(--text-tertiary); }
  .vf-hero-sec .vf-legend2{ margin-top:14px; }
  .vf-swing{ display:flex; flex-direction:column; gap:9px; }
  .vf-swing-row{ display:flex; align-items:center; gap:9px; }
  .vf-swing-dir{ font-size:var(--fs-micro); font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--win); width:78px; flex:none; }
  .vf-swing-down{ color:var(--loss); }
  .vf-swing-gap{ margin-left:auto; font-weight:800; color:var(--win); font-size:var(--fs-body-lg); }
  .vf-swing-gap.is-down{ color:var(--text-secondary); }
  .vf-swing-top{ color:var(--text-secondary); font-weight:600; }

  /* ===== H2H detail panel ===== */
  .vf-h2hwrap{ padding:14px; display:flex; flex-direction:column; gap:10px; }
  .vf-h2h-head{ display:flex; align-items:center; justify-content:space-between; }
  .vf-h2h-scoreline{ display:flex; align-items:center; justify-content:space-between; gap:8px; background:var(--surface-2); border-radius:var(--r-md); padding:10px 12px; }
  .vf-h2h-side{ display:flex; flex-direction:column; align-items:center; gap:1px; min-width:54px; }
  .vf-h2h-side b{ font-size:var(--fs-sm); } .vf-h2h-side .mono{ font-size:22px; font-weight:800; }
  .vf-h2h-verdict{ display:flex; flex-direction:column; align-items:center; font:700 var(--fs-micro)/1.3 var(--font-sans); letter-spacing:.06em; }
  .vf-h2h-verdict .mono{ font-size:20px; }
  .vf-h2h-verdict.is-win{ color:var(--win); } .vf-h2h-verdict.is-loss{ color:var(--loss); } .vf-h2h-verdict.is-draw{ color:var(--draw); }
  .vf-h2h-upside{ display:flex; justify-content:space-between; color:var(--text-secondary); padding:0 4px; }
  .vf-h2h-cols{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .vf-h2h-col{ background:var(--surface-2); border:1px solid var(--hairline); border-radius:var(--r-md); overflow:hidden; }
  .vf-h2h-colhead{ display:flex; align-items:center; gap:6px; padding:7px 9px; border-bottom:1px solid var(--hairline); }
  .vf-h2h-colhead b{ font-size:var(--fs-caption); } .vf-h2h-coltot{ margin-left:auto; font-weight:800; }
  .vf-h2h-list{ display:flex; flex-direction:column; }
  .vf-h2h-pl{ display:flex; align-items:center; gap:5px; padding:5px 8px; border-bottom:1px solid var(--hairline); width:100%; text-align:left; background:transparent; color:var(--text-primary); cursor:pointer; font:inherit; transition:background var(--dur-fast); }
  .vf-h2h-pl:last-child{ border-bottom:none; }
  .vf-h2h-pl:hover{ background:var(--surface-3); }
  .vf-h2h-chev{ color:var(--text-tertiary); font-size:14px; line-height:1; margin-left:1px; flex:none; }
  .vf-h2h-name{ flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .vf-h2h-plpts{ font-weight:700; font-size:var(--fs-caption); min-width:18px; text-align:right; }
  .vf-statusrow-live{ box-shadow:inset 2px 0 0 var(--live); }
  .vf-statusrow-ytp{ box-shadow:inset 2px 0 0 var(--hairline-strong); }
  .vf-statusrow-final{ box-shadow:inset 2px 0 0 var(--node-played); opacity:.82; }

  /* ===== live feed ===== */
  .vf-feedpanel{ padding:12px 14px; }
  .vf-feed-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .vf-feed-list{ display:flex; flex-direction:column; gap:6px; }
  .vf-feed-empty{ padding:12px 4px; }
  .vf-feed-item{ display:flex; align-items:center; gap:9px; padding:7px 8px; border-radius:var(--r-sm); background:var(--surface-2); border:1px solid var(--hairline); }
  .vf-feed-item.is-mine{ background:var(--accent-soft); border-color:color-mix(in srgb,var(--accent) 30%,transparent); }
  .vf-feed-item.is-fresh{ animation:feedflash 900ms var(--ease-out); }
  @keyframes feedflash{ 0%{ background:var(--ytp-soft); transform:translateX(-4px);} 100%{ transform:none; } }
  .vf-feed-min{ display:none; }
  .vf-feed-type{ font:800 9px/1 var(--font-sans); letter-spacing:.05em; color:var(--text-tertiary); width:26px; flex:none; }
  .vf-feed-main{ flex:1; min-width:0; display:flex; flex-direction:column; gap:1px; }
  .vf-feed-player{ display:flex; align-items:center; gap:5px; font-size:var(--fs-caption); }
  .vf-feed-player b{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .vf-feed-pts{ font-weight:800; font-size:var(--fs-sm); min-width:24px; text-align:right; }
  .vf-feed-pts.is-pos{ color:var(--win); } .vf-feed-pts.is-neg{ color:var(--loss); }

  /* ===== season ===== */
  .vf-season-note{ margin-bottom:14px; }
  .vf-seasontable .vf-st-mgr{ display:flex; align-items:center; gap:9px; }
  .vf-st-periods{ display:flex; gap:6px; }
  .vf-st-chip{ display:inline-flex; align-items:center; gap:4px; padding:3px 6px; background:var(--surface-2); border:1px solid var(--hairline); border-radius:var(--r-sm); }
  .vf-st-chip.is-live{ border-color:var(--live); box-shadow:0 0 0 1px var(--live-soft); }

  /* connection pill variants */
  .vf-conn{ }
  .vf-conn-recon{ background:var(--info-soft); color:var(--info); }
  .vf-conn-stale{ background:var(--surface-3); color:var(--text-secondary); }

  /* ============================ MOBILE ============================ */
  .mvf{ min-height:100%; background:var(--surface-0); color:var(--text-primary); font-family:var(--font-sans); }
  .mvf-head{ position:sticky; top:0; z-index:8; background:var(--surface-0); padding:48px 14px 10px; border-bottom:1px solid var(--hairline); }
  .mvf-headrow{ display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:10px; }
  .mvf-title{ font-weight:800; font-size:22px; line-height:1.1; }
  .mvf-tabs{ display:flex; width:100%; }
