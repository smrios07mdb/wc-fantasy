<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="cobalt" data-density="comfortable">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XI · Guillotine Theater</title>
<link rel="icon" type="image/png" sizes="32x32" href="logo/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="logo/icons/favicon-16.png">
<link rel="apple-touch-icon" href="logo/icons/apple-touch-icon.png">
<link rel="manifest" href="logo/icons/site.webmanifest">
<meta name="theme-color" content="#0A0D12">
<link rel="stylesheet" href="ds/ds.css">
<style>
  html,body{ height:100%; } body{ background:var(--surface-0); } #root{ min-height:100vh; }
  ::-webkit-scrollbar{ width:9px; height:9px; } ::-webkit-scrollbar-thumb{ background:var(--surface-4); border-radius:10px; border:2px solid var(--surface-1);}
  .po-livedot{ display:inline-block; width:5px; height:5px; border-radius:50%; background:var(--live); margin-left:4px; animation:livepulse 1.4s var(--ease-standard) infinite; }
  .tw-note{ font-size:11px; line-height:1.5; color:var(--text-secondary); padding:8px 2px 2px; } .tw-note b{ color:var(--text-primary); }

  /* ============================ STAGE ============================ */
  .vf-stage{ min-height:100vh; display:flex; flex-direction:column; padding:14px 16px 24px; gap:12px; }
  .vf-logo{ width:28px;height:28px;border-radius:7px;background:#0A0D12 url('logo/icon-tile.png') center/cover no-repeat;color:transparent;font-size:0;flex:none;box-shadow:inset 0 0 0 1px var(--hairline); }
  .vf-stagebar{ display:flex; align-items:center; gap:16px; flex-wrap:wrap; background:var(--surface-1); border:1px solid var(--hairline); border-radius:var(--r-lg); padding:10px 14px; }
  .vf-sb-title{ display:flex; align-items:center; gap:10px; }
  .vf-sb-sim{ display:flex; align-items:center; gap:8px; }
  .vf-sb-clock{ font-weight:700; font-size:14px; white-space:nowrap; }
  .vf-sb-range{ accent-color:var(--accent); height:4px; }
  .vf-sb-jumps{ display:flex; gap:4px; }
  .vf2-dropbtn{ font-weight:700; }
  .vf-sb-conn{ display:flex; align-items:center; gap:8px; margin-left:auto; }
  .vf2-phase{ font:700 11px/1 var(--font-sans); padding:6px 11px; border-radius:var(--r-pill); letter-spacing:.04em; text-transform:uppercase; background:var(--surface-3); color:var(--text-secondary); }
  .vf2-phase-armed{ background:var(--surface-3); color:var(--text-secondary); }
  .vf2-phase-wind{ background:var(--ytp-soft,rgba(226,135,60,.14)); color:var(--ytp); }
  .vf2-phase-drop{ background:var(--elim-soft); color:var(--elim); }
  .vf2-phase-aftermath{ background:var(--elim-soft); color:var(--elim); }
  .vf-fit{ flex:1; display:flex; justify-content:center; }
  .vf-frames{ display:flex; gap:30px; align-items:flex-start; transform-origin:top center; flex:none; }
  .vf2-col{ display:flex; flex-direction:column; gap:11px; }
  .vf2-cap{ display:flex; align-items:baseline; gap:9px; padding:0 4px; }
  .vf2-cap b{ font-size:17px; font-weight:800; letter-spacing:-.01em; }
  .vf2-cap-sub{ font-size:12px; color:var(--text-tertiary); }
  .vf2-cap-tag{ font:800 10px/1 var(--font-sans); letter-spacing:.06em; text-transform:uppercase; padding:4px 8px; border-radius:6px; }
  .vf2-tag-a{ background:var(--surface-3); color:var(--text-secondary); }
  .vf2-tag-b{ background:var(--accent-soft); color:var(--accent); }
  .vf-browser{ border-radius:14px; overflow:hidden; background:var(--surface-1); border:1px solid var(--hairline-strong); box-shadow:var(--e3); display:flex; flex-direction:column; }
  .vf-bw-bar{ height:38px; flex:none; display:flex; align-items:center; gap:8px; padding:0 14px; background:var(--surface-2); border-bottom:1px solid var(--hairline); }
  .vf-bw-dot{ width:11px; height:11px; border-radius:50%; }
  .vf-bw-url{ display:flex; align-items:center; gap:6px; margin-left:10px; background:var(--surface-0); border:1px solid var(--hairline); border-radius:var(--r-pill); padding:5px 12px; font-size:12px; color:var(--text-secondary); }
  .vf-bw-badge{ margin-left:auto; color:var(--text-tertiary); letter-spacing:.04em; }
  .vf-bw-body{ flex:1; min-height:0; }
  .vf-phone{ position:relative; flex:none; }
  .vf-phone-badge{ position:absolute; left:50%; bottom:-20px; transform:translateX(-50%); color:var(--text-tertiary); letter-spacing:.04em; white-space:nowrap; }

  /* ============================ shared product nav ============================ */
  .s2-nav{ flex:none; display:flex; align-items:center; gap:18px; padding:10px 20px; border-bottom:1px solid var(--hairline); background:var(--surface-1); }
  .s2-brand{ display:flex; align-items:center; gap:9px; } .s2-brand b{ font-size:15px; font-weight:800; }
  .s2-logo{ width:26px; height:26px; border-radius:7px; background:#0A0D12 url('logo/icon-tile.png') center/cover no-repeat; color:transparent; font-size:0; box-shadow:inset 0 0 0 1px var(--hairline); }
  .s2-links{ display:flex; gap:3px; }
  .s2-link{ padding:6px 11px; border-radius:var(--r-md); font-size:13px; font-weight:600; color:var(--text-secondary); text-decoration:none; }
  .s2-link.is-active{ background:var(--surface-3); color:var(--text-primary); }
  .s2-live{ margin-left:auto; display:inline-flex; align-items:center; gap:6px; font:700 11px/1 var(--font-sans); letter-spacing:.05em; color:var(--elim); background:var(--elim-soft); padding:6px 10px; border-radius:var(--r-pill); }
  .s2-live-dot{ width:6px; height:6px; border-radius:50%; background:var(--elim); animation:livepulse 1.5s var(--ease-standard) infinite; }
  .st-you{ flex:none; font-size:9px; font-weight:800; letter-spacing:.06em; color:var(--accent); background:var(--accent-soft); padding:2px 5px; border-radius:4px; margin-left:6px; }

  /* eyebrow shared */
  .da-eyebrow,.tb-eyebrow{ display:inline-flex; align-items:center; gap:8px; font-size:var(--fs-caption); font-weight:800; letter-spacing:.05em; text-transform:uppercase; color:var(--elim); }
  .da-eyebrow-dot{ width:7px; height:7px; border-radius:50%; background:var(--elim); animation:livepulse 1.6s var(--ease-standard) infinite; }

  /* ============================ parrot + machete ============================ */
  .po2-parrot{ display:inline-grid; place-items:center; border-radius:50%; flex:none; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,.4), 0 0 0 2px var(--surface-1); }
  .po2-parrot img{ width:118%; height:118%; object-fit:cover; border-radius:50%; }
  .po2-parrot-steel img{ filter:saturate(.72) brightness(.94) contrast(1.02); }
  .po2-trophy{ display:inline-flex; align-items:flex-end; justify-content:center; flex:none; transform-origin:bottom center; filter:drop-shadow(0 12px 22px rgba(0,0,0,.55)); }
  .po2-trophy img{ height:100%; width:auto; }
  @media (prefers-reduced-motion: no-preference){ .po2-trophy.is-squawk{ animation:po2-trophybob .6s var(--ease-out); } }
  @keyframes po2-trophybob{ 0%{ transform:rotate(0) translateY(0); } 28%{ transform:rotate(-5deg) translateY(-4px); } 60%{ transform:rotate(4deg); } 100%{ transform:rotate(0); } }
  .po2-machete{ display:inline-block; vertical-align:middle; filter:drop-shadow(0 2px 4px rgba(0,0,0,.4)); }
  .po2-machete.is-glow .po2-edge{ filter:drop-shadow(0 0 4px var(--elim)); }
  @media (prefers-reduced-motion: no-preference){
    .po2-parrot.is-squawk{ animation:po2-squawk .5s var(--ease-out); }
  }
  @keyframes po2-squawk{ 0%{ transform:scale(1) rotate(0); } 35%{ transform:scale(1.16) rotate(-7deg); } 70%{ transform:scale(1.05) rotate(4deg); } 100%{ transform:scale(1) rotate(0); } }

  /* ======================================================================== */
  /* DIRECTION B — FULL THEATER                                                */
  /* ======================================================================== */
  .tb{ position:relative; height:100%; display:flex; flex-direction:column; overflow:hidden; color:var(--text-primary); font-family:var(--font-sans);
       background:radial-gradient(110% 70% at 50% 0%, #161019 0%, #0c0a10 48%, var(--surface-0) 100%); }
  [data-theme="light"] .tb{ background:radial-gradient(110% 70% at 50% 0%, #efeaf2 0%, #e7e6ec 50%, var(--surface-0) 100%); }
  .tb-shake{ flex:1; min-height:0; display:flex; flex-direction:column; }
  .tb.phase-drop .tb-shake{ animation:tb-shake .42s var(--ease-standard); }
  @keyframes tb-shake{ 0%,100%{ transform:translate(0,0); } 15%{ transform:translate(-5px,3px) rotate(-.3deg); } 35%{ transform:translate(6px,-2px) rotate(.3deg); } 55%{ transform:translate(-4px,2px); } 75%{ transform:translate(3px,-1px); } }
  .tb-scroll{ flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column; }

  .tb-marquee{ text-align:center; padding:16px 20px 4px; display:flex; flex-direction:column; align-items:center; gap:7px; }
  .tb-headline{ font-size:40px; font-weight:900; line-height:.98; letter-spacing:-.02em; text-transform:uppercase; text-wrap:balance;
       background:linear-gradient(180deg,#fff, #c9d1dd); -webkit-background-clip:text; background-clip:text; color:transparent; filter:drop-shadow(0 2px 10px rgba(0,0,0,.5)); }
  [data-theme="light"] .tb-headline{ background:linear-gradient(180deg,#2a2230,#5a5560); -webkit-background-clip:text; background-clip:text; }
  .tb-headline.is-chop{ color:var(--elim); -webkit-text-fill-color:var(--elim); background:none; animation:tb-chop .5s var(--ease-out); font-size:58px; }
  @keyframes tb-chop{ 0%{ transform:scale(.4) rotate(-8deg); } 60%{ transform:scale(1.18) rotate(3deg); } 100%{ transform:scale(1) rotate(0); } }
  .tb-subcopy{ font-size:17px; font-weight:700; color:var(--text-secondary); max-width:42ch; }
  .tb-substats{ font-size:12px; color:var(--text-tertiary); font-weight:600; letter-spacing:.01em; }

  /* the stage */
  .tb-main{ display:grid; grid-template-columns:1.4fr 366px; gap:14px; padding:8px 14px 18px; align-items:stretch; }
  .tb-stage{ position:relative; min-height:0; margin:0; border-radius:18px; overflow:hidden; display:flex; flex-direction:column; justify-content:flex-start;
       background:linear-gradient(180deg, color-mix(in srgb,#1a1320 60%, var(--surface-1)) 0%, color-mix(in srgb,#0c0a10 70%, var(--surface-1)) 100%); border:1px solid var(--hairline-strong); }
  [data-theme="light"] .tb-stage{ background:linear-gradient(180deg, var(--surface-2), var(--surface-1)); }
  .tb-spot{ position:absolute; top:-60px; width:340px; height:480px; pointer-events:none; opacity:.7;
       background:radial-gradient(50% 40% at 50% 0%, rgba(255,246,224,.22), transparent 72%); filter:blur(2px); }
  .tb-spot-l{ left:6%; transform:rotate(14deg); } .tb-spot-r{ right:6%; transform:rotate(-14deg); }
  .tb-floor{ position:absolute; left:0; right:0; bottom:0; height:150px; background:linear-gradient(180deg, transparent, color-mix(in srgb,var(--elim) 12%, transparent)); }

  .tb-act{ position:relative; z-index:3; display:flex; flex-direction:column; align-items:center; padding:22px 0 2px; }
  .tb-act-glow{ position:absolute; top:80px; width:280px; height:280px; border-radius:50%; background:radial-gradient(circle, color-mix(in srgb,var(--accent) 18%, transparent), transparent 66%); }
  .tb-mech{ position:relative; width:380px; height:348px; display:flex; align-items:flex-end; justify-content:center; }
  .tb-act-fig{ position:relative; z-index:2; }
  .tb.phase-wind .tb-act-fig{ transform:rotate(-3deg); transition:transform .55s var(--ease-out); }
  .tb-act-blade{ position:absolute; left:50%; bottom:178px; z-index:3; transform-origin:18px 30px; transform:translateX(30px) rotate(-26deg); }
  .tb.phase-wind .tb-act-blade{ transform:translateX(24px) rotate(-46deg); transition:transform .55s var(--ease-out); }
  .tb.is-dropped .tb-act-blade{ transform:translate(8px,64px) rotate(76deg); transition:transform .2s cubic-bezier(.5,0,.82,.5); }
  @media (prefers-reduced-motion: no-preference){
    .tb.phase-armed .tb-act-blade{ animation:tb-hover 2.4s ease-in-out infinite; }
  }
  @keyframes tb-hover{ 0%,100%{ transform:translateX(30px) rotate(-26deg); } 50%{ transform:translateX(29px) rotate(-30deg); } }
  .tb-act-stand{ width:150px; height:16px; border-radius:50%/14px; margin-top:-4px;
       background:radial-gradient(50% 100% at 50% 0%, color-mix(in srgb,var(--accent) 30%, transparent), transparent 70%); }
  .tb-act-cap{ margin-top:8px; font-size:var(--fs-micro); font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--text-tertiary); }

  /* slash + sparks on the drop */
  .tb-slash{ position:absolute; inset:-15%; z-index:4; pointer-events:none; opacity:0;
       background:linear-gradient(120deg, transparent 45%, rgba(150,12,20,0) 46.5%, #b3141d 48.5%, #ef2630 50%, #b3141d 51.5%, rgba(150,12,20,0) 55%, transparent 56%);
       filter:drop-shadow(0 0 12px rgba(220,22,32,.75)); }
  .tb.is-dropped .tb-slash{ opacity:1; animation:tb-slash .55s var(--ease-out); }
  @keyframes tb-slash{ 0%{ transform:translate(-36%,-36%) scaleX(1.3); opacity:0; } 24%{ opacity:1; } 100%{ transform:translate(36%,36%) scaleX(1.3); opacity:0; } }
  .tb-sparks{ position:absolute; left:50%; top:60%; z-index:5; pointer-events:none; }
  .tb-spark{ position:absolute; width:10px; height:10px; border-radius:50% 50% 50% 0; background:radial-gradient(circle at 40% 35%, #ff4b52, #c01622); box-shadow:0 0 6px rgba(216,30,40,.55); opacity:0; }
  .tb-gore{ position:absolute; left:0; right:0; top:47%; height:42%; z-index:4; pointer-events:none; opacity:0; transition:opacity .3s ease .14s; }
  .tb.is-dropped .tb-gore{ opacity:1; }
  .tb-gore-drip{ position:absolute; top:0; width:8px; border-radius:0 0 60% 60% / 0 0 82% 82%; background:linear-gradient(180deg,#ef2630,#9c1620); box-shadow:0 1px 4px rgba(0,0,0,.4); transform-origin:top; }
  .tb-gore-drip.g1{ left:30%; height:26px; } .tb-gore-drip.g2{ left:46%; height:42px; width:9px; } .tb-gore-drip.g3{ left:60%; height:18px; } .tb-gore-drip.g4{ left:72%; height:32px; }
  .tb-gore-drop{ position:absolute; width:7px; height:9px; border-radius:50%; background:#d41d27; box-shadow:0 1px 3px rgba(0,0,0,.4); }
  .tb-gore-drop.gd1{ left:46.2%; top:56px; } .tb-gore-drop.gd2{ left:30.4%; top:38px; }
  @media (prefers-reduced-motion: no-preference){ .tb.is-dropped .tb-gore-drip.g2{ animation:tbl-ooze 3s ease-in-out infinite .3s; } }
  .tb-blood{ position:absolute; inset:-45% -45% -55% -45%; z-index:0; opacity:0; transition:opacity .25s ease .1s; pointer-events:none;
       background:
         radial-gradient(circle at 28% 36%, #c81620 0 7px, transparent 8px),
         radial-gradient(circle at 72% 58%, #c81620 0 10px, transparent 11px),
         radial-gradient(circle at 52% 84%, #9c1620 0 6px, transparent 7px),
         radial-gradient(circle at 16% 70%, #c81620 0 4px, transparent 5px),
         radial-gradient(circle at 86% 30%, #c81620 0 4px, transparent 5px),
         radial-gradient(ellipse 62% 54% at 50% 50%, color-mix(in srgb,#c81620 50%, transparent), transparent 72%); }
  .tb-victim.is-out .tb-blood{ opacity:1; }
  .tb.is-dropped .tb-spark{ animation:tb-spark .55s var(--ease-out) forwards; }
  .tb-spark.s0{ --ang:0deg; } .tb-spark.s1{ --ang:40deg; } .tb-spark.s2{ --ang:80deg; } .tb-spark.s3{ --ang:120deg; } .tb-spark.s4{ --ang:160deg; } .tb-spark.s5{ --ang:200deg; } .tb-spark.s6{ --ang:240deg; } .tb-spark.s7{ --ang:290deg; } .tb-spark.s8{ --ang:330deg; }
  @keyframes tb-spark{ 0%{ opacity:1; transform:rotate(var(--ang)) translateX(0) scale(1.2); } 100%{ opacity:0; transform:rotate(var(--ang)) translateX(80px) scale(.3); } }

  /* the chopping block */
  .tb-blockstage{ position:relative; z-index:3; padding:20px 18px 16px; display:flex; flex-direction:column; gap:8px; align-items:center; }
  .tb-blockstage-lab{ display:inline-flex; align-items:center; gap:6px; white-space:nowrap; font-size:var(--fs-caption); font-weight:800; letter-spacing:.04em; text-transform:uppercase; color:var(--elim); } .tb-blockstage-lab svg{ width:12px; height:12px; }e-lab svg{ width:12px; height:12px; }
  .tb-victims{ display:flex; gap:110px; }
  .tb-victim{ position:relative; display:flex; flex-direction:column; align-items:center; gap:6px; }
  .tb-victim-fig{ position:relative; }
  .tb-victim .avatar{ box-shadow:0 0 0 3px var(--elim), 0 6px 14px rgba(0,0,0,.4); }
  @media (prefers-reduced-motion: no-preference){ .tb:not(.is-dropped) .tb-victim-fig{ animation:tb-tremble 1.8s ease-in-out infinite; } }
  @keyframes tb-tremble{ 0%,100%{ transform:translateX(0) rotate(0); } 25%{ transform:translateX(-1.5px) rotate(-1deg); } 75%{ transform:translateX(1.5px) rotate(1deg); } }
  .tb-sweat{ position:absolute; width:6px; height:8px; border-radius:0 100% 100% 100%; background:var(--info); transform:rotate(45deg); opacity:.85; z-index:3; }
  .tb-sweat-1{ top:-2px; right:-3px; } .tb-sweat-2{ top:8px; left:-5px; width:5px; height:7px; animation-delay:.6s; }
  @media (prefers-reduced-motion: no-preference){ .tb:not(.is-dropped) .tb-sweat{ animation:tb-drip 1.9s ease-in infinite; } }
  @keyframes tb-drip{ 0%{ transform:translateY(0) rotate(45deg); opacity:.85; } 70%{ opacity:.85; } 100%{ transform:translateY(16px) rotate(45deg); opacity:0; } }
  .tb.is-dropped .tb-sweat{ display:none; }
  .tb-stamp{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%) rotate(-13deg) scale(1); z-index:5; white-space:nowrap;
       font:900 13.5px/1 var(--font-sans); letter-spacing:.03em; color:#fff; background:var(--elim); padding:6px 11px; border-radius:7px; box-shadow:0 4px 14px rgba(0,0,0,.55); opacity:0; border:2px solid #fff; }
  .tb-victim.is-out .tb-stamp{ opacity:1; animation:tb-stamp-pop .42s var(--ease-out); }
  @keyframes tb-stamp-pop{ 0%{ transform:translate(-50%,-50%) rotate(-13deg) scale(2.4); } 60%{ transform:translate(-50%,-50%) rotate(-13deg) scale(.88); } 100%{ transform:translate(-50%,-50%) rotate(-13deg) scale(1); } }
  .tb-victim.is-out .avatar{ filter:grayscale(.7) brightness(.66); }
  .tb-victim-name{ font-size:var(--fs-sm); font-weight:700; display:flex; align-items:center; }
  .tb-victim-pts{ font-size:15px; font-weight:800; color:var(--text-secondary); } .tb-victim-pts small{ font-size:10px; margin-left:2px; color:var(--text-tertiary); }
  .tb-block-wood{ width:80px; height:14px; border-radius:4px; background:linear-gradient(180deg,#6b5440,#4a3a2c); box-shadow:0 4px 8px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.12); }
  .tb-victim.is-me .tb-victim-name{ color:var(--accent); }

  /* safe gallery */
  .tb-gallery{ padding:14px 18px 6px; display:flex; flex-direction:column; gap:9px; }
  .tb-gallery-lab{ display:inline-flex; align-items:center; gap:6px; font-size:var(--fs-caption); font-weight:800; letter-spacing:.04em; text-transform:uppercase; color:var(--win); } .tb-gallery-lab svg{ width:12px; height:12px; }
  .tb-gallery-row{ display:flex; flex-wrap:wrap; gap:8px; }
  .tb-safe{ display:inline-flex; align-items:center; gap:7px; padding:5px 11px 5px 5px; border-radius:var(--r-pill); background:var(--surface-2); border:1px solid var(--hairline); }
  .tb-safe.is-me{ background:var(--accent-soft); border-color:color-mix(in srgb,var(--accent) 40%, transparent); }
  .tb-safe-name{ font-size:var(--fs-caption); font-weight:600; }
  .tb-safe-pts{ font-size:12px; font-weight:800; color:var(--text-secondary); }

  /* facts row */
  .tb-facts{ display:grid; grid-template-columns:1fr 1.25fr; gap:12px; padding:10px 18px 16px; align-items:stretch; }

  /* leaderboard (always easy to read) */
  .tbl{ display:flex; flex-direction:column; background:var(--surface-1); border:1px solid var(--hairline); border-radius:var(--r-lg); overflow:hidden; align-self:stretch; }
  .tbl-head{ display:flex; align-items:center; justify-content:space-between; padding:16px 16px; border-bottom:1px solid var(--hairline); }
  .tbl-head-live{ display:inline-flex; align-items:center; gap:5px; font-size:var(--fs-micro); font-weight:700; color:var(--elim); }
  .tbl-live-dot{ width:6px; height:6px; border-radius:50%; background:var(--elim); animation:livepulse 1.5s var(--ease-standard) infinite; }
  .tbl-body{ display:flex; flex-direction:column; gap:6px; padding:9px; flex:1; }
  .tbl-row{ display:grid; grid-template-columns:24px 26px 1fr auto auto; align-items:center; gap:11px; padding:11px 12px; border-radius:11px; background:var(--surface-2); transition:opacity .3s, filter .3s; }
  .tbl-rank{ font-size:14px; font-weight:700; color:var(--text-tertiary); text-align:center; }
  .tbl-name{ font-size:15px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:flex; align-items:center; }
  .tbl-stat{ font-size:var(--fs-caption); font-weight:700; padding:3px 9px; border-radius:var(--r-pill); white-space:nowrap; }
  .tbl-stat.is-safe{ color:var(--win); background:var(--win-soft); }
  .tbl-stat.is-zone{ color:var(--elim); background:var(--elim-soft); }
  .tbl-pts{ font-size:23px; font-weight:800; min-width:32px; text-align:right; font-variant-numeric:tabular-nums; }
  .tbl-row.is-me{ background:var(--accent-soft); box-shadow:inset 3px 0 0 var(--accent); } .tbl-row.is-me .tbl-rank{ color:var(--accent); }
