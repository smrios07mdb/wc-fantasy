<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="cobalt" data-density="comfortable">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XI · Waivers</title>
<link rel="icon" type="image/png" sizes="32x32" href="logo/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="logo/icons/favicon-16.png">
<link rel="apple-touch-icon" href="logo/icons/apple-touch-icon.png">
<link rel="manifest" href="logo/icons/site.webmanifest">
<meta name="theme-color" content="#0A0D12">
<link rel="stylesheet" href="ds/ds.css">
<style>
  html,body{ height:100%; } body{ background:var(--surface-0); } #root{ min-height:100vh; }
  :root{ --kit-outline: rgba(255,255,255,0.55); }
  [data-theme="light"]{ --kit-outline: rgba(13,20,33,0.40); }
  ::-webkit-scrollbar{ width:10px; height:10px; } ::-webkit-scrollbar-thumb{ background:var(--surface-4); border-radius:10px; border:2px solid var(--surface-1);}
  .rt-livedot{ display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--live); vertical-align:middle; animation:livepulse 1.4s var(--ease-standard) infinite; }

  /* ============================ STAGE (shared vocabulary) ============================ */
  .vf-stage{ min-height:100vh; display:flex; flex-direction:column; padding:14px 16px 28px; gap:12px; }
  .vf-logo{ width:28px;height:28px;border-radius:7px;background:#0A0D12 url('logo/icon-tile.png') center/cover no-repeat;color:transparent;font-size:0;flex:none;box-shadow:inset 0 0 0 1px var(--hairline); }
  .vf-stagebar{ display:flex; align-items:center; gap:16px; flex-wrap:wrap; background:var(--surface-1); border:1px solid var(--hairline); border-radius:var(--r-lg); padding:10px 14px; }
  .vf-sb-title{ display:flex; align-items:center; gap:10px; }
  .vf-sb-sim{ display:flex; align-items:center; gap:8px; }
  .vf-sb-clock{ font-weight:700; font-size:14px; white-space:nowrap; }
  .vf-sb-range{ accent-color:var(--accent); height:4px; }
  .vf-sb-jumps{ display:flex; gap:4px; }
  .vf-sb-conn{ display:flex; align-items:center; gap:4px; flex-wrap:wrap; margin-left:auto; }
  .vf-connbtn{ border:1px solid var(--hairline); background:var(--surface-2); color:var(--text-secondary); font:600 11px/1 var(--font-sans); padding:6px 9px; border-radius:var(--r-sm); cursor:pointer; text-transform:capitalize; }
  .vf-connbtn.is-active{ background:var(--accent-soft); border-color:var(--accent); color:var(--text-primary); }
  .vf-fit{ flex:1; display:flex; justify-content:center; }
  .vf-frames{ display:flex; gap:28px; align-items:flex-start; transform-origin:top center; flex:none; }
  .vf-browser{ width:1180px; height:980px; border-radius:14px; overflow:hidden; background:var(--surface-1); border:1px solid var(--hairline-strong); box-shadow:var(--e3); display:flex; flex-direction:column; }
  .vf-bw-bar{ height:40px; flex:none; display:flex; align-items:center; gap:8px; padding:0 14px; background:var(--surface-2); border-bottom:1px solid var(--hairline); }
  .vf-bw-dot{ width:11px; height:11px; border-radius:50%; }
  .vf-bw-url{ display:flex; align-items:center; gap:6px; margin-left:10px; background:var(--surface-0); border:1px solid var(--hairline); border-radius:var(--r-pill); padding:5px 12px; font-size:12px; color:var(--text-secondary); }
  .vf-bw-badge{ margin-left:auto; color:var(--text-tertiary); letter-spacing:.04em; }
  .vf-bw-body{ flex:1; min-height:0; }
  .vf-phone{ position:relative; flex:none; }
  .vf-phone-badge{ position:absolute; left:50%; bottom:-22px; transform:translateX(-50%); color:var(--text-tertiary); letter-spacing:.04em; white-space:nowrap; }
  .vf-banner{ display:flex; align-items:center; gap:8px; padding:8px 18px; font-size:var(--fs-sm); flex:none; }
  .vf-banner-recon{ background:var(--info-soft); color:var(--text-primary); }
  .mvf-banner{ margin:0; padding:8px 14px; font-size:var(--fs-caption); }

  /* kit chip (shared w/ Free Agents) — flag rendered via background shorthand; DO NOT force
     background-size (each gradient layer carries its own size, e.g. flag cantons) */
  .fa-kit{ width:30px; height:30px; border-radius:7px; flex:none; background:var(--surface-4); box-shadow:inset 0 0 0 1.5px var(--kit-outline); border:1px solid var(--hairline); }
  .fa-kit-sm{ width:24px; height:24px; border-radius:6px; }
  .fa-cut{ display:inline-flex; align-items:center; gap:5px; padding:4px 8px; border-radius:var(--r-sm); font-size:var(--fs-caption); font-weight:600; white-space:nowrap; }
  .fa-cut-open{ background:var(--surface-2); border:1px solid var(--hairline); color:var(--text-secondary); }
  .fa-cut-soon{ background:var(--ytp-soft); border:1px solid color-mix(in srgb,var(--ytp) 40%, transparent); color:var(--ytp); }
  .fa-cut-closed{ background:var(--locked-soft); border:1px solid color-mix(in srgb,var(--locked) 35%, transparent); color:var(--locked); }
  .fa-cut-sub::before{ content:'·'; margin:0 4px; opacity:.55; } .fa-cut-sub{ font-size:10px; opacity:.9; }

  /* ============================ desktop app ============================ */
  .wv-app{ height:100%; display:flex; flex-direction:column; background:var(--surface-0); }
  .wv-top{ display:flex; align-items:center; gap:16px; padding:11px 18px; border-bottom:1px solid var(--hairline); background:var(--surface-1); flex:none; }
  .wv-brand{ display:flex; align-items:center; gap:10px; } .wv-brand-title{ font-weight:800; font-size:17px; }
  .wv-nav{ display:flex; gap:4px; }
  .wv-nav-item{ padding:7px 12px; border-radius:var(--r-md); font-size:var(--fs-sm); font-weight:600; color:var(--text-secondary); cursor:pointer; text-decoration:none; }
  .wv-nav-item:hover{ background:var(--surface-2); color:var(--text-primary); } .wv-nav-item.is-active{ background:var(--surface-3); color:var(--text-primary); }
  .wv-top-spacer{ flex:1; }
  .wv-tabs{ display:flex; gap:4px; padding:10px 18px 0; border-bottom:1px solid var(--hairline); background:var(--surface-1); flex:none; }
  .wv-tab{ position:relative; padding:9px 14px; border:none; background:none; color:var(--text-secondary); font:700 14px/1 var(--font-sans); cursor:pointer; border-bottom:2px solid transparent; display:inline-flex; align-items:center; gap:7px; }
  .wv-tab:hover{ color:var(--text-primary); } .wv-tab.is-active{ color:var(--text-primary); border-bottom-color:var(--accent); }
  .wv-tab-badge{ font-size:10px; font-weight:800; background:var(--accent-soft); color:var(--accent); padding:2px 6px; border-radius:var(--r-pill); }

  .wv-scroll{ flex:1; min-height:0; overflow-y:auto; }
  .wv-resetbanner{ display:flex; align-items:center; gap:9px; margin:16px 18px 0; padding:11px 14px; background:var(--accent-soft); border:1px solid var(--accent); border-radius:var(--r-md); font-size:var(--fs-sm); color:var(--text-primary); } .wv-resetbanner svg{ color:var(--accent); flex:none; }

  .wv-claims-page{ display:grid; grid-template-columns:1fr 320px; gap:16px; padding:18px; max-width:1080px; margin:0 auto; }
  .wv-claims-main{ display:flex; flex-direction:column; gap:12px; min-width:0; }
  .wv-rail{ display:flex; flex-direction:column; gap:14px; }
  .wv-card{ background:var(--surface-1); border:1px solid var(--hairline); border-radius:var(--r-lg); padding:14px 16px; }

  .wv-batchbar{ display:flex; align-items:center; justify-content:space-between; gap:16px; background:var(--surface-1); border:1px solid var(--hairline); border-radius:var(--r-lg); padding:13px 16px; }
  .wv-batchbar-l{ display:flex; flex-direction:column; gap:2px; } .wv-batchbar-when{ font-size:var(--fs-body-lg); font-weight:800; }
  .wv-batchbar-r{ display:flex; flex-direction:column; align-items:flex-end; gap:2px; } .wv-batchbar-cd{ font-size:22px; font-weight:800; color:var(--accent); }

  .wv-voidnote{ display:flex; align-items:center; gap:9px; padding:10px 13px; background:var(--refund-soft); border:1px solid color-mix(in srgb,var(--refund) 40%, transparent); border-radius:var(--r-md); font-size:var(--fs-sm); color:var(--text-secondary); } .wv-voidnote svg{ color:var(--refund); flex:none; } .wv-voidnote b{ color:var(--refund); }

  .wv-claims-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:2px; }
  .wv-claims-list{ display:flex; flex-direction:column; gap:10px; }
  .wv-claims-foot{ line-height:1.5; padding:2px 2px; }
  .wv-empty{ display:flex; flex-direction:column; align-items:center; gap:8px; padding:36px; text-align:center; background:var(--surface-1); border:1px dashed var(--hairline-strong); border-radius:var(--r-lg); } .wv-empty b{ font-size:var(--fs-body-lg); }

  /* claim row — two lines: ADD (top) / DROP (bottom) */
  .wv-claim{ display:grid; grid-template-columns:38px 1fr 96px 76px; align-items:center; gap:14px; background:var(--surface-1); border:1px solid var(--hairline); border-radius:var(--r-lg); padding:12px 16px; }
  .wv-claim.is-void{ border-color:color-mix(in srgb,var(--refund) 45%, transparent); background:color-mix(in srgb,var(--refund) 7%, var(--surface-1)); }
  .wv-claim-pri{ display:flex; flex-direction:column; align-items:center; gap:1px; }
  .wv-pri-btn{ border:none; background:none; color:var(--text-tertiary); cursor:pointer; padding:1px; line-height:0; border-radius:3px; } .wv-pri-btn:hover:not(:disabled){ color:var(--accent); background:var(--surface-3); } .wv-pri-btn:disabled{ opacity:.3; cursor:default; }
  .wv-pri-n{ font-weight:800; font-size:16px; font-variant-numeric:tabular-nums; }
  .wv-claim-body{ display:flex; flex-direction:column; gap:7px; min-width:0; }
  .wv-claim-line{ display:flex; align-items:center; gap:8px; min-width:0; }
  .wv-claim-line.is-drop{ opacity:.92; }
  .wv-claim-tag{ font-size:9px; font-weight:800; letter-spacing:.06em; padding:2px 6px; border-radius:4px; flex:none; width:38px; text-align:center; }
  .wv-tag-add{ color:var(--win); background:var(--win-soft); }
  .wv-tag-drop{ color:var(--text-tertiary); background:var(--surface-3); }
  .wv-name{ font-weight:600; font-size:var(--fs-body); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .wv-name-drop{ font-weight:500; color:var(--text-secondary); }
  .wv-claim-line .wv-name{ flex:1 1 auto; min-width:40px; }
  /* clickable player (opens the shared Points/Stats card) */
  .wv-padd{ display:inline-flex; align-items:center; gap:8px; background:none; border:0; padding:0; margin:0; cursor:pointer; color:inherit; font:inherit; text-align:left; min-width:0; }
  .wv-padd:hover .wv-name{ color:var(--accent); }
  .wv-claim-line .wv-padd{ flex:1 1 auto; min-width:40px; }
  .wv-claim-line .pos{ flex:none; }
  .wv-claim-line .fa-cut{ flex:none; }
  .wv-claim-bid{ display:flex; flex-direction:column; align-items:flex-start; gap:3px; }
  .wv-bid-amt{ font-size:22px; font-weight:800; line-height:1; }
  .wv-bid-sealed{ display:inline-flex; align-items:center; gap:3px; font-size:10px; font-weight:700; color:var(--text-tertiary); text-transform:uppercase; letter-spacing:.04em; white-space:nowrap; }
  .wv-claim-act{ display:flex; align-items:center; justify-content:flex-end; gap:4px; }
  .wv-icon-btn{ display:grid; place-items:center; width:30px; height:30px; border:1px solid var(--hairline); background:var(--surface-2); color:var(--text-secondary); border-radius:var(--r-sm); cursor:pointer; }
  .wv-icon-btn:hover{ color:var(--text-primary); background:var(--surface-3); } .wv-icon-btn.is-danger:hover{ color:var(--danger); border-color:color-mix(in srgb,var(--danger) 40%, transparent); }
  .wv-void-tag{ display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; color:var(--refund); background:var(--refund-soft); padding:5px 9px; border-radius:var(--r-pill); white-space:nowrap; }

  /* FAAB bar */
  .wv-faab{ display:flex; flex-direction:column; gap:8px; }
  .wv-faab-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .wv-faab-stat{ display:flex; flex-direction:column; gap:2px; } .wv-faab-stat.is-right{ align-items:flex-end; }
  .wv-faab-stat .t-label{ white-space:nowrap; }
  .wv-faab-big{ font-size:20px; font-weight:800; line-height:1; } .wv-faab-big.is-low{ color:var(--ytp); }
  .wv-faab-track{ position:relative; height:10px; border-radius:var(--r-pill); background:var(--surface-3); overflow:hidden; }
  .wv-faab-fill{ position:absolute; left:0; top:0; bottom:0; background:var(--accent-soft); border-radius:var(--r-pill); }
  .wv-faab-pend{ position:absolute; left:0; top:0; bottom:0; background:var(--accent); border-radius:var(--r-pill); }
  .wv-faab-legend{ display:flex; gap:14px; font-size:11px; color:var(--text-secondary); }
  .wv-faab-legend span{ display:inline-flex; align-items:center; gap:5px; }
  .wv-dot{ width:8px; height:8px; border-radius:2px; } .wv-dot-left{ background:var(--accent-soft); } .wv-dot-pend{ background:var(--accent); }
  .wv-faab.is-compact .wv-faab-legend{ display:none; }

  /* waiver order */
  .wv-order-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .wv-order-mine{ font-size:var(--fs-caption); font-weight:700; color:var(--accent); background:var(--accent-soft); padding:3px 9px; border-radius:var(--r-pill); }
  .wv-order-list{ display:flex; flex-direction:column; gap:2px; }
  .wv-order-item{ display:flex; align-items:center; gap:9px; padding:5px 7px; border-radius:var(--r-sm); }
  .wv-order-item.is-me{ background:var(--accent-soft); box-shadow:inset 3px 0 0 var(--accent); }
  .wv-order-n{ width:18px; text-align:center; font-size:12px; font-weight:700; color:var(--text-tertiary); font-variant-numeric:tabular-nums; }
  .wv-order-name{ font-size:var(--fs-sm); font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .wv-order-note{ margin-top:10px; line-height:1.45; color:var(--text-secondary); }

  /* composer */
  .wv-scrim{ position:fixed; inset:0; background:var(--overlay); display:grid; place-items:center; z-index:90; padding:20px; }
  .wv-composer{ width:780px; max-width:100%; max-height:90vh; background:var(--surface-1); border:1px solid var(--hairline-strong); border-radius:var(--r-xl); box-shadow:var(--e3); display:flex; flex-direction:column; overflow:hidden; }
  .wv-comp-head{ display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-bottom:1px solid var(--hairline); } .wv-comp-title{ font-size:16px; font-weight:800; }
  .wv-comp-body{ display:grid; grid-template-columns:1fr 320px; min-height:0; flex:1; }
  .wv-comp-pick{ display:flex; flex-direction:column; gap:10px; padding:14px; border-right:1px solid var(--hairline); min-height:0; }
  .wv-comp-search .wv-comp-input{ width:100%; background:var(--surface-2); border:1px solid var(--hairline-strong); border-radius:var(--r-md); color:var(--text-primary); padding:9px 12px; font:500 14px var(--font-sans); outline:none; }
  .wv-comp-input::placeholder{ color:var(--text-tertiary); }
  .wv-comp-seg{ display:inline-flex; gap:2px; background:var(--surface-2); padding:3px; border-radius:var(--r-md); border:1px solid var(--hairline); align-self:flex-start; }
  .wv-seg-btn{ padding:6px 12px; border-radius:var(--r-sm); border:none; background:transparent; color:var(--text-secondary); font:700 12px/1 var(--font-sans); cursor:pointer; }
  .wv-seg-btn:hover{ color:var(--text-primary); } .wv-seg-btn.is-active{ background:var(--surface-4); color:var(--text-primary); }
  .wv-comp-list{ display:flex; flex-direction:column; gap:4px; overflow-y:auto; min-height:240px; max-height:420px; }
  .wv-comp-empty{ padding:24px 8px; text-align:center; }
  .wv-comp-fa{ display:flex; align-items:center; gap:10px; padding:8px 10px; border:1px solid transparent; border-radius:var(--r-md); background:none; cursor:pointer; text-align:left; color:var(--text-primary); }
  .wv-comp-fa:hover{ background:var(--surface-2); } .wv-comp-fa.is-sel{ background:var(--accent-soft); border-color:var(--accent); }
  .wv-comp-fa-id{ flex:1; display:flex; flex-direction:column; gap:1px; min-width:0; }
  .wv-comp-rivals{ display:inline-flex; align-items:center; gap:3px; font-size:11px; font-weight:700; color:var(--ytp); }
  .wv-comp-config{ display:flex; flex-direction:column; gap:14px; padding:16px; overflow-y:auto; }
  .wv-comp-placeholder{ margin:auto; text-align:center; padding:30px 10px; }
  .wv-comp-selplayer{ display:flex; align-items:center; gap:10px; padding-bottom:12px; border-bottom:1px solid var(--hairline); }
  .wv-comp-selmeta{ display:flex; align-items:center; gap:6px; margin-top:3px; }
  .wv-comp-field{ display:flex; flex-direction:column; gap:8px; }
  .wv-bid-stepper{ display:flex; align-items:center; gap:10px; }
  .wv-bid-input{ width:80px; text-align:center; background:var(--surface-2); border:1px solid var(--hairline-strong); border-radius:var(--r-md); color:var(--text-primary); padding:8px; font-size:18px; font-weight:800; outline:none; }
  .wv-bid-input:focus{ border-color:var(--accent); }
  .wv-drop-pick{ display:flex; flex-direction:column; gap:5px; max-height:200px; overflow-y:auto; }
  .wv-drop-opt{ display:flex; align-items:center; gap:8px; padding:7px 9px; border:1px solid var(--hairline); border-radius:var(--r-md); background:var(--surface-2); cursor:pointer; text-align:left; color:var(--text-primary); }
  .wv-drop-opt:hover{ background:var(--surface-3); } .wv-drop-opt.is-sel{ background:var(--accent-soft); border-color:var(--accent); }
  .wv-drop-optname{ flex:1; font-size:var(--fs-sm); font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .wv-comp-rules{ display:flex; flex-direction:column; gap:7px; padding:10px 12px; background:var(--surface-2); border-radius:var(--r-md); }
  .wv-comp-rule{ display:flex; align-items:flex-start; gap:7px; font-size:var(--fs-caption); color:var(--text-secondary); line-height:1.4; } .wv-comp-rule svg{ color:var(--text-tertiary); flex:none; margin-top:2px; }
  .wv-comp-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:auto; }

  /* results */
  .wv-results-page{ padding:18px; max-width:880px; margin:0 auto; }
  .wv-results-main{ display:flex; flex-direction:column; gap:18px; }
  .wv-results-head{ display:flex; align-items:baseline; justify-content:space-between; }
  .wv-batch{ display:flex; flex-direction:column; gap:10px; }
  .wv-batch-head{ display:flex; align-items:baseline; gap:10px; padding-bottom:8px; border-bottom:1px solid var(--hairline); } .wv-batch-when{ font-size:var(--fs-body-lg); font-weight:800; }
  .wv-batch-list{ display:flex; flex-direction:column; gap:8px; }
  .wv-res{ display:grid; grid-template-columns:1.3fr 1fr 1.2fr; align-items:center; gap:12px; padding:11px 14px; background:var(--surface-1); border:1px solid var(--hairline); border-radius:var(--r-lg); }
  .wv-res.is-mine{ background:var(--accent-soft); box-shadow:inset 3px 0 0 var(--accent); }
  .wv-res-add{ display:flex; align-items:center; gap:9px; min-width:0; }
  .wv-res-id{ display:flex; flex-direction:column; gap:1px; min-width:0; } .wv-res-id .t-micro{ display:inline-flex; align-items:center; gap:5px; }
  .wv-res-mid{ display:flex; justify-content:center; }
  .wv-res-winner{ display:inline-flex; align-items:center; gap:7px; } .wv-res-wname{ font-size:var(--fs-sm); font-weight:600; }
  .wv-res-out{ font-size:11px; font-weight:700; padding:2px 8px; border-radius:var(--r-pill); text-transform:uppercase; letter-spacing:.03em; }
  .wv-out-won{ color:var(--win); background:var(--win-soft); } .wv-out-lost{ color:var(--loss); background:var(--loss-soft); } .wv-out-void{ color:var(--refund); background:var(--refund-soft); display:inline-flex; align-items:center; gap:4px; }
  .wv-res-bid{ display:flex; flex-direction:column; align-items:flex-end; gap:2px; } .wv-res-amt{ font-size:18px; font-weight:800; line-height:1; } .wv-res-note{ color:var(--text-tertiary); font-style:italic; }
  /* results table layout */
  .wv-batch-list.is-table{ gap:0; border:1px solid var(--hairline); border-radius:var(--r-lg); overflow:hidden; }
  .wv-batch-list.is-table .wv-res{ border:none; border-bottom:1px solid var(--hairline); border-radius:0; background:var(--surface-1); }
  .wv-batch-list.is-table .wv-res:last-child{ border-bottom:none; }
  .wv-batch-list.is-table .wv-res.is-mine{ background:var(--accent-soft); }

  /* ============================ mobile ============================ */
  .mwv{ min-height:100%; background:var(--surface-0); color:var(--text-primary); font-family:var(--font-sans); display:flex; flex-direction:column; }
  .mwv-head{ padding:46px 14px 0; border-bottom:1px solid var(--hairline); background:var(--surface-1); display:flex; flex-direction:column; gap:11px; }
  .mwv-headrow{ display:flex; align-items:center; justify-content:space-between; }
  .mwv-title{ font-size:24px; font-weight:800; line-height:1; }
  .mwv-faab{ padding:2px 0; }
  .mwv-tabs{ display:flex; gap:4px; }
