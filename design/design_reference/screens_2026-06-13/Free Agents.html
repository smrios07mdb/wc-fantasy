<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="cobalt" data-density="comfortable">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XI · Free Agents</title>
<link rel="icon" type="image/png" sizes="32x32" href="logo/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="logo/icons/favicon-16.png">
<link rel="apple-touch-icon" href="logo/icons/apple-touch-icon.png">
<link rel="manifest" href="logo/icons/site.webmanifest">
<meta name="theme-color" content="#0A0D12">
<link rel="stylesheet" href="ds/ds.css">
<style>
  html,body{ height:100%; } body{ background:var(--surface-0); } #root{ min-height:100vh; }
  :root{ --kit-outline: rgba(255,255,255,0.55); }
  [data-theme="light"]{ --kit-outline: rgba(13,20,33,0.40); }
  ::-webkit-scrollbar{ width:10px; height:10px; } ::-webkit-scrollbar-thumb{ background:var(--surface-4); border-radius:10px; border:2px solid var(--surface-1);}
  .rt-livedot{ display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--live); vertical-align:middle; animation:livepulse 1.4s var(--ease-standard) infinite; }

  /* ============================ STAGE (shared vocabulary) ============================ */
  .vf-stage{ min-height:100vh; display:flex; flex-direction:column; padding:14px 16px 28px; gap:12px; }
  .vf-logo{ width:28px;height:28px;border-radius:7px;background:#0A0D12 url('logo/icon-tile.png') center/cover no-repeat;color:transparent;font-size:0;flex:none;box-shadow:inset 0 0 0 1px var(--hairline); }
  .vf-stagebar{ display:flex; align-items:center; gap:16px; flex-wrap:wrap; background:var(--surface-1); border:1px solid var(--hairline); border-radius:var(--r-lg); padding:10px 14px; }
  .vf-sb-title{ display:flex; align-items:center; gap:10px; }
  .vf-sb-sim{ display:flex; align-items:center; gap:8px; }
  .vf-sb-clock{ font-weight:700; font-size:14px; white-space:nowrap; }
  .vf-sb-range{ accent-color:var(--accent); height:4px; }
  .vf-sb-jumps{ display:flex; gap:4px; }
  .vf-sb-conn{ display:flex; align-items:center; gap:4px; flex-wrap:wrap; margin-left:auto; }
  .vf-connbtn{ border:1px solid var(--hairline); background:var(--surface-2); color:var(--text-secondary); font:600 11px/1 var(--font-sans); padding:6px 9px; border-radius:var(--r-sm); cursor:pointer; text-transform:capitalize; }
  .vf-connbtn.is-active{ background:var(--accent-soft); border-color:var(--accent); color:var(--text-primary); }

  .vf-fit{ flex:1; display:flex; justify-content:center; }
  .vf-frames{ display:flex; gap:28px; align-items:flex-start; transform-origin:top center; flex:none; }
  .vf-browser{ width:1180px; height:980px; border-radius:14px; overflow:hidden; background:var(--surface-1); border:1px solid var(--hairline-strong); box-shadow:var(--e3); display:flex; flex-direction:column; }
  .vf-bw-bar{ height:40px; flex:none; display:flex; align-items:center; gap:8px; padding:0 14px; background:var(--surface-2); border-bottom:1px solid var(--hairline); }
  .vf-bw-dot{ width:11px; height:11px; border-radius:50%; }
  .vf-bw-url{ display:flex; align-items:center; gap:6px; margin-left:10px; background:var(--surface-0); border:1px solid var(--hairline); border-radius:var(--r-pill); padding:5px 12px; font-size:12px; color:var(--text-secondary); }
  .vf-bw-badge{ margin-left:auto; color:var(--text-tertiary); letter-spacing:.04em; }
  .vf-bw-body{ flex:1; min-height:0; }
  .vf-phone{ position:relative; flex:none; }
  .vf-phone-badge{ position:absolute; left:50%; bottom:-22px; transform:translateX(-50%); color:var(--text-tertiary); letter-spacing:.04em; white-space:nowrap; }
  .vf-banner{ display:flex; align-items:center; gap:8px; padding:8px 18px; font-size:var(--fs-sm); flex:none; }
  .vf-banner-recon{ background:var(--info-soft); color:var(--text-primary); }
  .vf-banner-stale{ background:var(--surface-2); color:var(--text-secondary); border-bottom:1px solid var(--hairline); }
  .mvf-banner{ margin:0; padding:8px 14px; font-size:var(--fs-caption); }

  /* ============================ kit chip ============================ */
  .fa-kit{ width:30px; height:30px; border-radius:7px; flex:none; background:var(--surface-4); box-shadow:inset 0 0 0 1.5px var(--kit-outline); border:1px solid var(--hairline); }
  .fa-kit-sm{ width:26px; height:26px; border-radius:6px; }

  /* ============================ desktop app ============================ */
  .fa-app{ height:100%; display:flex; flex-direction:column; background:var(--surface-0); }
  .fa-top{ display:flex; align-items:center; gap:16px; padding:11px 18px; border-bottom:1px solid var(--hairline); background:var(--surface-1); flex:none; }
  .fa-brand{ display:flex; align-items:center; gap:10px; } .fa-brand-title{ font-weight:800; font-size:17px; }
  .fa-nav{ display:flex; gap:4px; }
  .fa-nav-item{ padding:7px 12px; border-radius:var(--r-md); font-size:var(--fs-sm); font-weight:600; color:var(--text-secondary); cursor:pointer; text-decoration:none; }
  .fa-nav-item:hover{ background:var(--surface-2); color:var(--text-primary); }
  .fa-nav-item.is-active{ background:var(--surface-3); color:var(--text-primary); }
  .fa-top-spacer{ flex:1; }
  .fa-faab{ display:flex; align-items:center; gap:8px; padding:6px 12px; background:var(--surface-2); border:1px solid var(--hairline); border-radius:var(--r-pill); }
  .fa-faab-num{ font-weight:800; font-size:15px; } .fa-faab-meter{ height:6px; }

  .fa-scroll{ flex:1; min-height:0; overflow-y:auto; }
  .fa-page{ padding:18px; display:flex; flex-direction:column; gap:14px; max-width:1080px; margin:0 auto; width:100%; }

  /* match strip */
  .fa-ms{ display:flex; align-items:stretch; gap:12px; }
  .fa-ms-lab{ align-self:center; white-space:nowrap; }
  .fa-ms-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; flex:1; }
  .fa-ms-card{ display:flex; flex-direction:column; gap:6px; padding:9px 11px; background:var(--surface-1); border:1px solid var(--hairline); border-radius:var(--r-md); }
  .fa-ms-card.s-live{ border-color:color-mix(in srgb,var(--live) 40%, var(--hairline)); }
  .fa-ms-clk{ font-size:11px; font-weight:700; display:inline-flex; align-items:center; gap:4px; }
  .fa-ms-clk.is-live{ color:var(--live); } .fa-ms-clk.is-final{ color:var(--text-tertiary); } .fa-ms-clk.is-ytp{ color:var(--text-secondary); }
  .fa-ms-teams{ display:flex; align-items:center; justify-content:space-between; gap:6px; }
  .fa-ms-t{ display:inline-flex; align-items:center; gap:5px; font-size:13px; font-weight:700; }
  .fa-ms-score{ font-weight:700; font-size:13px; color:var(--text-secondary); }
  .fa-ms-cut{ font-size:10px; font-weight:700; letter-spacing:.02em; color:var(--win); text-transform:uppercase; }
  .fa-ms-cut.is-closed{ color:var(--locked); }

  /* count band */
  .fa-band{ display:flex; align-items:center; justify-content:space-between; gap:18px; flex-wrap:wrap; padding:10px 14px; background:var(--surface-1); border:1px solid var(--hairline); border-radius:var(--r-md); }
  .fa-band-counts{ display:flex; align-items:center; gap:12px; font-size:var(--fs-sm); flex:none; }
  .fa-bc{ display:inline-flex; align-items:center; gap:5px; white-space:nowrap; } .fa-bc b{ font-weight:800; font-size:15px; }
  .fa-bc.is-closed{ color:var(--locked); }
  .fa-bc-div{ width:1px; height:16px; background:var(--hairline); }
  .fa-band-rule{ display:inline-flex; align-items:center; gap:6px; color:var(--text-tertiary); flex:1 1 300px; min-width:0; line-height:1.45; } .fa-band-rule b{ color:var(--text-secondary); } .fa-band-rule svg{ flex:none; }

  /* toolbar */
  .fa-toolbar{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .fa-search{ display:flex; align-items:center; gap:8px; background:var(--surface-2); border:1px solid var(--hairline-strong); border-radius:var(--r-md); padding:0 10px; height:38px; flex:1; min-width:200px; color:var(--text-tertiary); }
  .fa-search:focus-within{ border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  .fa-search-input{ flex:1; background:none; border:none; outline:none; color:var(--text-primary); font:500 14px var(--font-sans); }
  .fa-search-input::placeholder{ color:var(--text-tertiary); }
  .fa-search-clear{ border:none; background:none; color:var(--text-tertiary); font-size:18px; cursor:pointer; line-height:1; }
  .fa-seg{ display:inline-flex; gap:2px; background:var(--surface-2); padding:3px; border-radius:var(--r-md); border:1px solid var(--hairline); }
  .fa-seg-btn{ display:inline-flex; align-items:center; padding:6px 11px; border-radius:var(--r-sm); border:none; background:transparent; color:var(--text-secondary); font:600 12px/1 var(--font-sans); cursor:pointer; white-space:nowrap; }
  .fa-seg-btn:hover{ color:var(--text-primary); } .fa-seg-btn.is-active{ background:var(--surface-4); color:var(--text-primary); }
  .fa-seg-btn .pos{ pointer-events:none; }
  .fa-sortrow{ display:inline-flex; align-items:center; gap:8px; }
  .fa-owntoggle{ display:inline-flex; align-items:center; gap:8px; border:1px solid var(--hairline); background:var(--surface-2); color:var(--text-secondary); font:600 12px/1 var(--font-sans); padding:7px 11px; border-radius:var(--r-md); cursor:pointer; }
  .fa-owntoggle.is-on{ color:var(--text-primary); border-color:var(--accent); background:var(--accent-soft); }
  .fa-owntoggle-track{ width:30px; height:17px; border-radius:var(--r-pill); background:var(--surface-4); position:relative; transition:background var(--dur-fast); flex:none; }
  .fa-owntoggle.is-on .fa-owntoggle-track{ background:var(--accent); }
  .fa-owntoggle-knob{ position:absolute; top:2px; left:2px; width:13px; height:13px; border-radius:50%; background:#fff; transition:left var(--dur-fast); }
  .fa-owntoggle.is-on .fa-owntoggle-knob{ left:15px; }

  /* list */
  .fa-listcard{ background:var(--surface-1); border:1px solid var(--hairline); border-radius:var(--r-lg); padding:6px 8px 8px; }
  .fa-list-head, .fa-row{ display:grid; grid-template-columns:42px minmax(150px,1fr) 152px 184px 116px 112px; align-items:center; gap:10px; }
  .fa-list-head{ padding:8px 10px; font-size:var(--fs-micro); font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--text-tertiary); }
  .fa-lh-stats{ text-align:right; }
  .fa-list{ display:flex; flex-direction:column; }
  .fa-row{ padding:8px 10px; border-radius:var(--r-md); cursor:pointer; transition:background var(--dur-fast); }
  .fa-row + .fa-row{ border-top:1px solid var(--hairline); }
  .fa-row:hover{ background:var(--surface-2); }
  .fa-row.is-closed{ opacity:.62; } .fa-row.is-closed:hover{ opacity:.8; }
  .fa-row.is-owned{ opacity:.7; }
  .fa-c-name{ display:flex; align-items:center; gap:10px; min-width:0; }
  .fa-namecol{ display:flex; flex-direction:column; gap:1px; min-width:0; flex:1; }
  .fa-name{ font-weight:600; font-size:var(--fs-body); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .fa-meta{ display:flex; align-items:center; gap:7px; white-space:nowrap; }
  .fa-droptag{ display:inline-flex; align-items:center; gap:2px; color:var(--refund); font-weight:700; }
  .fa-droptag-card{ margin-left:auto; font-size:10px; padding:3px 7px; background:var(--refund-soft); border-radius:var(--r-pill); }
  .fa-c-stats{ justify-self:end; }

  /* fixture */
  .fa-fx{ display:inline-flex; align-items:center; gap:5px; font-size:var(--fs-sm); }
  .fa-fx-vs{ color:var(--text-tertiary); font-size:11px; } .fa-fx-opp{ font-weight:700; }
  .fa-fx-clk{ margin-left:3px; font-weight:700; font-size:11px; display:inline-flex; align-items:center; gap:3px; }
  .fa-fx-clk.is-live{ color:var(--live); } .fa-fx-clk.is-final{ color:var(--text-tertiary); } .fa-fx-clk.is-ytp{ color:var(--text-secondary); }
  .fa-fx-mini{ font-size:var(--fs-caption); }

  /* cutoff tag */
  .fa-cut{ display:inline-flex; align-items:center; gap:5px; padding:5px 9px; border-radius:var(--r-sm); font-size:var(--fs-caption); font-weight:600; white-space:nowrap; }
  .fa-cut-open{ background:var(--surface-2); border:1px solid var(--hairline); color:var(--text-secondary); }
  .fa-cut-soon{ background:var(--ytp-soft); border:1px solid color-mix(in srgb,var(--ytp) 40%, transparent); color:var(--ytp); }
  .fa-cut-closed{ background:var(--locked-soft); border:1px solid color-mix(in srgb,var(--locked) 35%, transparent); color:var(--locked); }
  .fa-cut-sub::before{ content:'·'; margin:0 4px; opacity:.55; }
  .fa-cut-sub{ font-size:10px; opacity:.9; }

  /* stats */
  .fa-stats{ display:inline-flex; align-items:center; gap:14px; }
  .fa-stat{ display:inline-flex; flex-direction:column; align-items:flex-end; gap:1px; } .fa-stat b{ font-size:16px; font-weight:800; line-height:1; } .fa-stat small{ font-size:9px; font-weight:700; letter-spacing:.05em; color:var(--text-tertiary); }
  .fa-stat-proj b{ font-size:14px; color:var(--text-secondary); }
  .fa-stats.is-stacked{ gap:10px; }

  /* acquire */
  .fa-c-act{ justify-self:end; }
  .fa-bid{ min-width:92px; }
  .fa-bid:disabled{ opacity:.45; cursor:not-allowed; background:var(--surface-3); color:var(--text-tertiary); }
  .fa-owner{ display:inline-flex; align-items:center; gap:6px; padding:4px 10px 4px 4px; background:var(--surface-2); border:1px solid var(--hairline); border-radius:var(--r-pill); }
  .fa-owner-lab{ font-size:var(--fs-caption); font-weight:600; color:var(--text-secondary); }

  /* cards variant */
  .fa-cards{ display:grid; grid-template-columns:repeat(auto-fill,minmax(232px,1fr)); gap:12px; }
  .fa-card{ display:flex; flex-direction:column; gap:11px; padding:13px; background:var(--surface-1); border:1px solid var(--hairline); border-radius:var(--r-lg); cursor:pointer; transition:border-color var(--dur-fast), transform var(--dur-fast); }
  .fa-card:hover{ border-color:var(--hairline-strong); }
  .fa-card.is-closed{ opacity:.66; } .fa-card.is-owned{ opacity:.74; }
  .fa-card-top{ display:flex; align-items:center; gap:10px; }
  .fa-card-id{ display:flex; flex-direction:column; gap:3px; min-width:0; flex:1; }
  .fa-card-sub{ display:flex; align-items:center; gap:7px; }
  .fa-card-mid{ display:flex; flex-direction:column; gap:7px; padding:10px 0; border-top:1px solid var(--hairline); border-bottom:1px solid var(--hairline); }
  .fa-card-foot{ display:flex; align-items:center; justify-content:space-between; gap:10px; }

  .fa-empty{ padding:40px; text-align:center; color:var(--text-tertiary); background:var(--surface-1); border:1px solid var(--hairline); border-radius:var(--r-lg); }
  .fa-foot{ text-align:center; line-height:1.5; padding:2px 20px; }

  /* bid preview modal */
  .fa-scrim{ position:fixed; inset:0; background:var(--overlay); display:grid; place-items:center; z-index:90; padding:20px; }
  .fa-bidmodal{ width:400px; max-width:100%; background:var(--surface-1); border:1px solid var(--hairline-strong); border-radius:var(--r-xl); box-shadow:var(--e3); padding:18px; display:flex; flex-direction:column; gap:14px; }
  .fa-bid-head{ display:flex; align-items:center; gap:11px; }
  .fa-bid-id{ flex:1; display:flex; flex-direction:column; gap:3px; }
  .fa-bid-sub{ display:flex; align-items:center; gap:7px; }
  .fa-bid-preview-tag{ font-size:10px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--info); background:var(--info-soft); padding:3px 8px; border-radius:var(--r-pill); }
  .fa-bid-budget{ display:flex; flex-direction:column; gap:7px; }
  .fa-bid-budget .t-label, .fa-bid-amt .t-label{ white-space:nowrap; }
  .fa-bid-budrow{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; } .fa-bid-budrow b{ font-size:18px; font-weight:800; white-space:nowrap; } .fa-bid-budtot{ color:var(--text-tertiary); font-weight:600; font-size:13px; }
  .fa-bid-amt{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 12px; background:var(--surface-2); border-radius:var(--r-md); }
  .fa-bid-stepper{ display:inline-flex; align-items:center; gap:10px; } .fa-bid-amtval{ font-size:20px; font-weight:800; min-width:48px; text-align:center; }
  .fa-bid-rules{ display:flex; flex-direction:column; gap:7px; }
  .fa-bid-rule{ display:flex; align-items:flex-start; gap:7px; font-size:var(--fs-caption); color:var(--text-secondary); line-height:1.4; }
  .fa-bid-rule svg{ color:var(--text-tertiary); flex:none; margin-top:2px; }
  .fa-bid-actions{ display:flex; justify-content:flex-end; gap:10px; }
  .fa-bid-foot{ text-align:center; line-height:1.4; }
  .fa-bid-closed{ display:flex; flex-direction:column; gap:14px; }

  /* ============================ mobile ============================ */
  .mfa{ min-height:100%; background:var(--surface-0); color:var(--text-primary); font-family:var(--font-sans); display:flex; flex-direction:column; }
  .mfa-head{ padding:46px 14px 12px; border-bottom:1px solid var(--hairline); background:var(--surface-1); display:flex; flex-direction:column; gap:11px; }
  .mfa-headrow{ display:flex; align-items:center; justify-content:space-between; }
  .mfa-title{ font-size:24px; font-weight:800; line-height:1; }
  .mfa-faab{ display:flex; flex-direction:column; gap:6px; }
  .mfa-faab-top{ display:flex; align-items:baseline; justify-content:space-between; } .mfa-faab-top b{ font-weight:800; }
  .mfa-search{ display:flex; align-items:center; gap:8px; background:var(--surface-2); border:1px solid var(--hairline-strong); border-radius:var(--r-md); padding:0 10px; height:38px; color:var(--text-tertiary); }
  .mfa-search-input{ flex:1; background:none; border:none; outline:none; color:var(--text-primary); font:500 15px var(--font-sans); }
  .mfa-search-input::placeholder{ color:var(--text-tertiary); }
  .mfa-filters{ display:flex; align-items:center; gap:6px; overflow-x:auto; }
  .mfa-chip{ flex:none; padding:6px 13px; border-radius:var(--r-pill); border:1px solid var(--hairline); background:var(--surface-2); color:var(--text-secondary); font:700 12px/1 var(--font-sans); cursor:pointer; }
  .mfa-chip.is-active{ background:var(--accent-soft); border-color:var(--accent); color:var(--text-primary); }
  .mfa-filt-div{ width:1px; height:18px; background:var(--hairline); flex:none; }
  .mfa-sort{ flex:none; background:var(--surface-2); border:1px solid var(--hairline); border-radius:var(--r-pill); color:var(--text-primary); font:600 12px var(--font-sans); padding:6px 10px; }
  .mfa-owntoggle{ display:inline-flex; align-items:center; gap:8px; align-self:flex-start; border:1px solid var(--hairline); background:var(--surface-2); color:var(--text-secondary); font:600 12px/1 var(--font-sans); padding:7px 11px; border-radius:var(--r-pill); cursor:pointer; }
  .mfa-owntoggle.is-on{ color:var(--text-primary); border-color:var(--accent); background:var(--accent-soft); }
  .mfa-scroll{ flex:1; padding:12px; display:flex; flex-direction:column; gap:8px; }
  .mfa-row{ display:flex; align-items:center; gap:11px; padding:10px 12px; background:var(--surface-1); border:1px solid var(--hairline); border-radius:var(--r-md); cursor:pointer; text-align:left; color:inherit; font:inherit; }
  .mfa-row.is-closed{ opacity:.62; } .mfa-row.is-owned{ opacity:.74; }
  .mfa-namecol{ flex:1; min-width:0; display:flex; flex-direction:column; gap:3px; }
  .mfa-meta{ display:flex; align-items:center; gap:7px; }
  .mfa-right{ display:flex; flex-direction:column; align-items:flex-end; gap:5px; flex:none; }
  .mfa-szn{ display:inline-flex; align-items:baseline; gap:3px; } .mfa-szn b{ font-size:16px; font-weight:800; } .mfa-szn small{ font-size:9px; font-weight:700; color:var(--text-tertiary); }
  .mfa-owner .avatar{ }

  @media (max-width: 980px){ .vf-sb-conn{ margin-left:0; } }
</style>
</head>
<body>
<div id="root"></div>
<template id="__bundler_thumbnail">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <rect width="100" height="100" fill="#11151C"/>
    <circle cx="34" cy="34" r="11" fill="none" stroke="#4D8DFF" stroke-width="3"/>
    <rect x="41" y="41" width="9" height="3" rx="1.5" transform="rotate(45 41 41)" fill="#4D8DFF"/>
    <rect x="20" y="58" width="60" height="8" rx="2" fill="#181D27"/>
    <rect x="20" y="70" width="44" height="8" rx="2" fill="#181D27"/>
    <rect x="70" y="70" width="10" height="8" rx="2" fill="#2FBF71"/>
  </svg>
</template>
