<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="cobalt" data-density="comfortable">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guillotine Playoffs — World Cup Fantasy</title>
<link rel="stylesheet" href="ds/ds.css">
<style>
  html,body{ height:100%; } body{ background:var(--surface-0); } #root{ min-height:100vh; }
  ::-webkit-scrollbar{ width:10px; height:10px; } ::-webkit-scrollbar-thumb{ background:var(--surface-4); border-radius:10px; border:2px solid var(--surface-1);}
  .rt-livedot{ display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--live); vertical-align:middle; animation:livepulse 1.4s var(--ease-standard) infinite; }
  .po-livedot{ display:inline-block; width:5px; height:5px; border-radius:50%; background:var(--live); margin-left:4px; animation:livepulse 1.4s var(--ease-standard) infinite; }

  /* guillotine frame tone (functional red blade stays --elim) */
  :root{ --po-frame:#6E5743; --po-wood:#5A4636; }
  [data-theme="light"]{ --po-frame:#8A6E54; --po-wood:#A88560; }

  /* ============================ STAGE (shared vocabulary) ============================ */
  .vf-stage{ min-height:100vh; display:flex; flex-direction:column; padding:14px 16px 28px; gap:12px; }
  .vf-logo{ width:28px;height:28px;border-radius:7px;background:var(--accent);display:grid;place-items:center;color:var(--text-on-accent);font-family:var(--font-display);font-weight:800; flex:none; }
  .vf-stagebar{ display:flex; align-items:center; gap:16px; flex-wrap:wrap; background:var(--surface-1); border:1px solid var(--hairline); border-radius:var(--r-lg); padding:10px 14px; }
  .vf-sb-title{ display:flex; align-items:center; gap:10px; }
  .vf-sb-sim{ display:flex; align-items:center; gap:8px; }
  .vf-sb-clock{ font-weight:700; font-size:14px; white-space:nowrap; }
  .vf-sb-range{ accent-color:var(--accent); height:4px; }
  .vf-sb-jumps{ display:flex; gap:4px; }
  .vf-sb-conn{ display:flex; align-items:center; gap:4px; flex-wrap:wrap; margin-left:auto; }
  .vf-connbtn{ border:1px solid var(--hairline); background:var(--surface-2); color:var(--text-secondary); font:600 11px/1 var(--font-sans); padding:6px 9px; border-radius:var(--r-sm); cursor:pointer; text-transform:capitalize; }
  .vf-connbtn.is-active{ background:var(--accent-soft); border-color:var(--accent); color:var(--text-primary); }
  .vf-fit{ flex:1; display:flex; justify-content:center; }
  .vf-frames{ display:flex; gap:28px; align-items:flex-start; transform-origin:top center; flex:none; }
  .vf-browser{ width:1180px; height:1130px; border-radius:14px; overflow:hidden; background:var(--surface-1); border:1px solid var(--hairline-strong); box-shadow:var(--e3); display:flex; flex-direction:column; }
  .vf-bw-bar{ height:40px; flex:none; display:flex; align-items:center; gap:8px; padding:0 14px; background:var(--surface-2); border-bottom:1px solid var(--hairline); }
  .vf-bw-dot{ width:11px; height:11px; border-radius:50%; }
  .vf-bw-url{ display:flex; align-items:center; gap:6px; margin-left:10px; background:var(--surface-0); border:1px solid var(--hairline); border-radius:var(--r-pill); padding:5px 12px; font-size:12px; color:var(--text-secondary); }
  .vf-bw-badge{ margin-left:auto; color:var(--text-tertiary); letter-spacing:.04em; }
  .vf-bw-body{ flex:1; min-height:0; }
  .vf-phone{ position:relative; flex:none; }
  .vf-phone-badge{ position:absolute; left:50%; bottom:-22px; transform:translateX(-50%); color:var(--text-tertiary); letter-spacing:.04em; white-space:nowrap; }
  .vf-banner{ display:flex; align-items:center; gap:8px; padding:8px 18px; font-size:var(--fs-sm); flex:none; }
  .vf-banner-recon{ background:var(--info-soft); color:var(--text-primary); }
  .vf-banner-stale{ background:var(--surface-2); color:var(--text-secondary); border-bottom:1px solid var(--hairline); }
  .mvf-banner{ margin:0; padding:8px 14px; font-size:var(--fs-caption); }

  /* ============================ app shell (shared with standings) ============================ */
  .st-app{ height:100%; display:flex; flex-direction:column; background:var(--surface-0); }
  .st-top{ display:flex; align-items:center; gap:18px; padding:11px 18px; border-bottom:1px solid var(--hairline); background:var(--surface-1); flex:none; }
  .st-brand{ display:flex; align-items:center; gap:10px; } .st-brand-title{ font-weight:800; font-size:17px; }
  .st-nav{ display:flex; gap:4px; }
  .st-nav-item{ padding:7px 12px; border-radius:var(--r-md); font-size:var(--fs-sm); font-weight:600; color:var(--text-secondary); cursor:pointer; text-decoration:none; }
  .st-nav-item:hover{ background:var(--surface-2); color:var(--text-primary); }
  .st-nav-item.is-active{ background:var(--surface-3); color:var(--text-primary); }
  .st-top-spacer{ flex:1; }
  .st-scroll{ flex:1; min-height:0; overflow-y:auto; }
  .st-page{ padding:20px; display:flex; flex-direction:column; gap:16px; max-width:1100px; margin:0 auto; width:100%; }
  .st-explain{ display:flex; align-items:flex-start; gap:9px; padding:11px 14px; background:var(--info-soft); border:1px solid color-mix(in srgb, var(--info) 25%, transparent); border-radius:var(--r-md); font-size:var(--fs-sm); color:var(--text-secondary); line-height:1.45; }
  .st-explain b{ color:var(--text-primary); } .st-explain-ic{ color:var(--info); flex:none; margin-top:1px; }
  .st-foot{ text-align:center; line-height:1.5; padding:0 20px; }
  .st-you{ flex:none; font-size:9px; font-weight:800; letter-spacing:.06em; color:var(--accent); background:var(--accent-soft); padding:2px 5px; border-radius:4px; margin-left:5px; }

  /* ============================ playoff hero ============================ */
  .po-hero{ display:flex; align-items:stretch; gap:22px; background:
      linear-gradient(180deg, color-mix(in srgb,var(--elim) 9%, var(--surface-1)) 0%, var(--surface-1) 60%);
      border:1px solid color-mix(in srgb,var(--elim) 28%, var(--hairline)); border-radius:var(--r-xl); padding:20px 24px; position:relative; overflow:hidden; }
  .po-hero::before{ content:''; position:absolute; inset:0 0 auto 0; height:3px; background:var(--elim); opacity:.85; }
  .po-hero-lead{ flex:1; min-width:0; display:flex; flex-direction:column; gap:9px; }
  .po-eyebrow{ display:inline-flex; align-items:center; gap:8px; font-size:var(--fs-caption); font-weight:800; letter-spacing:.04em; text-transform:uppercase; color:var(--elim); }
  .po-eyebrow-dot{ width:7px; height:7px; border-radius:50%; background:var(--elim); animation:livepulse 1.6s var(--ease-standard) infinite; }
  .po-hero-title{ font-size:27px; font-weight:800; line-height:1.1; letter-spacing:-.01em; text-wrap:balance; }
  .po-hero-sub{ max-width:54ch; line-height:1.45; }
  .po-hero-me{ flex:none; width:300px; border-left:1px solid var(--hairline); padding-left:22px; display:flex; flex-direction:column; gap:9px; }
  .po-hero-rankrow{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .po-hero-rank{ font-size:40px; font-weight:800; line-height:1; letter-spacing:-.02em; }
  .po-hero-rank small{ font-size:13px; font-weight:600; color:var(--text-tertiary); margin-left:5px; }
  .po-hero-rank.is-safe{ color:var(--accent); } .po-hero-rank.is-zone{ color:var(--elim); }
  .po-hero-status{ display:inline-flex; align-items:center; gap:5px; font-size:var(--fs-caption); font-weight:700; padding:4px 10px; border-radius:var(--r-pill); }
  .po-hero-status.is-safe{ color:var(--accent); background:var(--accent-soft); }
  .po-hero-status.is-zone{ color:var(--elim); background:var(--elim-soft); }
  .po-hero-margin{ font-size:var(--fs-sm); color:var(--text-secondary); line-height:1.4; } .po-hero-margin b{ font-size:var(--fs-body-lg); }
  .po-hero-margin.is-safe b{ color:var(--accent); } .po-hero-margin.is-zone b{ color:var(--elim); }
  .po-explain{ }

  /* ============================ round-board layout ============================ */
  .po-board-wrap{ display:grid; grid-template-columns:1fr 348px; gap:16px; align-items:start; }
  .po-board-main{ background:var(--surface-1); border:1px solid var(--hairline); border-radius:var(--r-lg); padding:6px 8px 12px; }
  .po-board-bar{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 10px 8px; flex-wrap:wrap; }
  .po-board-title{ display:flex; flex-direction:column; gap:1px; } .po-board-title b{ font-size:18px; }
  .po-roundnav{ display:flex; gap:5px; }
  .po-rn-item{ display:flex; flex-direction:column; align-items:center; gap:1px; min-width:46px; padding:6px 8px; border-radius:var(--r-sm); border:1px solid var(--hairline); background:var(--surface-2); color:var(--text-secondary); cursor:pointer; }
  .po-rn-item .po-rn-num{ font-weight:800; font-size:13px; } .po-rn-item .po-rn-tag{ font-size:8px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--text-tertiary); }
  .po-rn-item.is-active{ border-color:var(--accent); background:var(--accent-soft); color:var(--text-primary); }
  .po-rn-item.st-live .po-rn-tag{ color:var(--live); } .po-rn-item.st-past .po-rn-tag{ color:var(--text-tertiary); }

  .po-board{ display:flex; flex-direction:column; }
  .po-thead, .po-row{ display:grid; grid-template-columns:42px minmax(170px,1fr) 132px 78px 84px 152px; align-items:center; gap:10px; }
  .po-thead{ padding:6px 12px 9px; }
  .po-th{ font-size:var(--fs-micro); font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--text-tertiary); }
  .po-th-c{ text-align:center; }
  .po-row{ padding:10px 12px; border-radius:var(--r-md); }
  .po-row + .po-row{ margin-top:2px; }
  .po-row.is-safe{ background:var(--surface-2); }
  .po-row.is-zone{ background:var(--elim-soft); box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--elim) 35%, transparent); }
  .po-row.is-elim{ background:transparent; opacity:.62; }
  .po-row.is-elim .po-mgr-name{ text-decoration:line-through; color:var(--text-tertiary); }
  .po-row.is-me{ background:var(--accent-soft); box-shadow:inset 3px 0 0 var(--accent); }
  .po-row.is-me.is-zone{ background:color-mix(in srgb,var(--elim) 16%, var(--accent-soft)); box-shadow:inset 3px 0 0 var(--accent), inset 0 0 0 1px color-mix(in srgb,var(--elim) 40%, transparent); }
  .po-seedbadge{ display:inline-grid; place-items:center; width:27px; height:27px; border-radius:7px; background:var(--surface-3); color:var(--text-secondary); font-weight:700; font-size:13px; font-variant-numeric:tabular-nums; }
  .po-row.is-me .po-seedbadge{ background:color-mix(in srgb,var(--accent) 24%, var(--surface-3)); color:var(--text-primary); }
  .po-c-mgr{ display:flex; align-items:center; gap:9px; min-width:0; }
  .po-mgr-name{ font-weight:600; font-size:var(--fs-body); white-space:nowrap; }
  .po-mgr-seed{ margin-left:2px; white-space:nowrap; }
  .po-c-rank{ text-align:center; font-weight:800; font-size:var(--fs-body); color:var(--text-secondary); }
  .po-c-pts{ text-align:center; font-weight:800; font-size:20px; font-variant-numeric:tabular-nums; }
  .po-c-pts small{ font-size:10px; font-weight:600; color:var(--text-tertiary); margin-left:3px; }
  .po-c-status{ display:flex; justify-content:flex-start; }

  /* status pills */
  .po-sp{ display:inline-flex; align-items:center; gap:5px; font-size:var(--fs-caption); font-weight:700; padding:4px 10px; border-radius:var(--r-pill); white-space:nowrap; }
  .po-sp-safe{ color:var(--win); background:var(--win-soft); }
  .po-sp-zone{ color:var(--elim); background:var(--elim-soft); }

  /* roster shape chip */
  .po-shapechip{ display:inline-flex; align-items:center; gap:9px; }
  .po-shapechip-txt{ display:flex; align-items:baseline; gap:3px; } .po-shapechip-txt b{ font-size:15px; font-weight:800; } .po-sc-plus{ font-size:11px; font-weight:700; color:var(--text-secondary); }
  .po-sc-sub{ font-size:9px; color:var(--text-tertiary); font-weight:600; margin-left:4px; white-space:nowrap; }
  .po-shape{ display:flex; flex-direction:column; gap:2px; padding:3px 5px; border-radius:5px; background:color-mix(in srgb,var(--win) 22%, var(--surface-3)); }
  .po-shape-lane{ display:flex; gap:2px; justify-content:center; }
  .po-shape-node{ width:5px; height:5px; border-radius:50%; }
  .po-shape-node.n-GK{ background:var(--pos-gk,#5E6E8C); } .po-shape-node.n-DEF{ background:var(--pos-def,#4DA8FF); }
  .po-shape-node.n-MID{ background:var(--pos-mid,#19E08A); } .po-shape-node.n-FWD{ background:var(--pos-fwd,#FF6B8A); }

  /* ============================ the guillotine ============================ */
  .po-guillo{ display:flex; flex-direction:column; gap:9px; margin:9px 4px; padding:7px 8px; }
  .po-guillo-top{ display:flex; align-items:center; gap:12px; }
  .po-guillo-svg{ flex:none; filter:drop-shadow(0 2px 3px rgba(0,0,0,.25)); }
  .po-guillo-svg .po-blade{ transform:translateY(0); transition:transform .45s var(--ease-out); }
  @media (prefers-reduced-motion: no-preference){
    .po-guillo:not(.is-dropped) .po-guillo-svg .po-blade{ animation:po-sway 2.6s ease-in-out infinite; }
    .po-guillo:not(.is-dropped) .po-victim{ animation:po-tremble 2.6s ease-in-out infinite; }
  }
  @keyframes po-sway{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(2px); } }
  @keyframes po-tremble{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-1.5px); } }
  .po-guillo.is-dropped .po-guillo-svg .po-blade{ transform:translateY(20px); animation:none; }
  .po-guillo-blade{ flex:1; height:3px; border-radius:2px; background:repeating-linear-gradient(90deg, var(--elim) 0 10px, color-mix(in srgb,var(--elim) 55%, transparent) 10px 16px); box-shadow:0 0 10px color-mix(in srgb,var(--elim) 45%, transparent); }
  .po-guillo.is-dropped .po-guillo-blade{ background:var(--elim); box-shadow:0 0 16px color-mix(in srgb,var(--elim) 70%, transparent); }
  .po-guillo-meta{ flex:none; max-width:230px; display:flex; flex-direction:column; gap:1px; align-items:flex-end; text-align:right; }
  .po-guillo-lab{ font-size:var(--fs-caption); font-weight:800; color:var(--elim); letter-spacing:.01em; } .po-guillo-lab b{ font-size:var(--fs-body); }
  .po-guillo-note{ color:var(--text-tertiary); text-transform:none; letter-spacing:0; }
  /* the doomed managers, teased under the blade */
  .po-guillo-victims{ display:flex; align-items:center; gap:11px; padding-left:60px; }
  .po-victim-lab{ font-size:9px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:var(--elim); }
  .po-victims-row{ display:flex; gap:12px; }
  .po-victim{ display:flex; flex-direction:column; align-items:center; gap:3px; }
  .po-victim .avatar{ box-shadow:0 0 0 2px var(--elim), 0 3px 6px rgba(0,0,0,.35); }
  .po-victim-name{ font-size:9.5px; font-weight:700; color:var(--elim); white-space:nowrap; }
  .po-guillo.is-dropped .po-victim{ opacity:.72; } .po-guillo.is-dropped .po-victim .avatar{ filter:grayscale(.55) brightness(.72); }

  /* ============================ right rail ============================ */
  .po-board-rail, .po-ladder-rail{ display:flex; flex-direction:column; gap:14px; position:sticky; top:8px; }
  .po-rail-card{ background:var(--surface-1); border:1px solid var(--hairline); border-radius:var(--r-lg); padding:14px; }
  .po-rail-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .po-rail-link{ display:inline-flex; align-items:center; gap:4px; font-size:var(--fs-caption); font-weight:700; color:var(--accent); }

  /* reduced pitch */
  .po-pitch{ display:flex; flex-direction:column; gap:11px; background:
      linear-gradient(180deg, color-mix(in srgb,var(--win) 12%, var(--surface-2)), color-mix(in srgb,var(--win) 6%, var(--surface-2)));
      border:1px solid var(--hairline); border-radius:var(--r-md); padding:14px 10px; }
  .po-pitch-lane{ display:flex; justify-content:center; gap:14px; }
  .po-node{ display:flex; flex-direction:column; align-items:center; gap:3px; width:56px; }
  .po-node-kit{ width:30px; height:30px; border-radius:50%; box-shadow:0 0 0 2px var(--kit-outline,rgba(255,255,255,.85)), 0 2px 5px rgba(0,0,0,.3); }
  .po-node.st-played .po-node-kit{ filter:brightness(.5) saturate(.7); }
  .po-node.st-live .po-node-kit{ box-shadow:0 0 0 2px var(--live), 0 0 9px color-mix(in srgb,var(--live) 60%, transparent); }
  .po-node-name{ font-size:9.5px; font-weight:700; color:var(--text-primary); text-align:center; white-space:nowrap; max-width:60px; overflow:hidden; text-overflow:ellipsis; text-shadow:0 1px 2px rgba(0,0,0,.5); }
  .po-node-pts{ font-size:11px; font-weight:800; font-variant-numeric:tabular-nums; color:var(--text-secondary); display:inline-flex; align-items:center; }
  .po-node-pts.is-live{ color:var(--live); }
  .po-pitch-bench{ display:flex; align-items:center; flex-wrap:wrap; gap:6px; border-top:1px dashed var(--hairline); padding-top:9px; margin-top:1px; }
  .po-bench-lab{ width:100%; margin-bottom:1px; }
  .po-bench-chip{ display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600; padding:3px 8px 3px 4px; border-radius:var(--r-pill); background:var(--surface-3); }
  .po-bench-chip.st-played{ opacity:.6; } .po-bench-kit{ width:16px; height:16px; border-radius:50%; box-shadow:0 0 0 1.5px var(--kit-outline,rgba(255,255,255,.8)); }

  .po-lockstrip{ display:flex; align-items:center; gap:14px; margin-top:11px; padding-top:11px; border-top:1px solid var(--hairline); }
  .po-ls-stat{ display:flex; flex-direction:column; } .po-ls-stat b{ font-size:18px; }
  .po-ls-cap{ margin-left:auto; }

  /* reinforce */
  .po-reinforce{ background:var(--surface-1); border:1px solid var(--hairline); border-radius:var(--r-lg); padding:14px; display:flex; flex-direction:column; gap:11px; }
  .po-reinforce-head{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .po-reset-tag{ display:inline-flex; align-items:center; gap:5px; font-size:var(--fs-caption); font-weight:700; color:var(--refund); background:var(--refund-soft); padding:3px 9px; border-radius:var(--r-pill); }
  .po-faab{ display:flex; align-items:center; gap:12px; }
  .po-faab-fig{ display:flex; flex-direction:column; flex:none; } .po-faab-fig b{ font-size:24px; line-height:1; }
  .po-reinforce-copy{ line-height:1.45; } .po-reinforce-copy b{ color:var(--text-primary); }

  /* ============================ ladder layout ============================ */
  .po-ladder-wrap{ display:grid; grid-template-columns:1fr 348px; gap:16px; align-items:start; }
  .po-ladder{ display:flex; gap:10px; overflow-x:auto; padding-bottom:6px; }
  .po-col{ flex:1; min-width:150px; background:var(--surface-1); border:1px solid var(--hairline); border-radius:var(--r-lg); padding:8px; display:flex; flex-direction:column; }
  .po-col.st-live{ border-color:color-mix(in srgb,var(--elim) 45%, var(--hairline)); box-shadow:0 0 0 1px color-mix(in srgb,var(--elim) 20%, transparent); }
  .po-col.is-future{ opacity:.92; }
  .po-col-head{ display:flex; align-items:center; gap:9px; padding:4px 6px 9px; border-bottom:1px solid var(--hairline); margin-bottom:7px; }
  .po-col-rnum{ width:30px; height:30px; border-radius:8px; display:grid; place-items:center; font-weight:800; font-size:13px; background:var(--surface-3); color:var(--text-secondary); flex:none; }
  .po-col.st-live .po-col-rnum{ background:var(--elim-soft); color:var(--elim); }
  .po-col-meta{ display:flex; flex-direction:column; gap:1px; min-width:0; }
  .po-col-tag{ font-size:10px; font-weight:800; letter-spacing:.04em; text-transform:uppercase; }
  .po-col-past{ color:var(--text-tertiary); } .po-col-live{ color:var(--elim); } .po-col-future{ color:var(--accent); }
  .po-col-body{ display:flex; flex-direction:column; gap:2px; }
  .po-lr{ display:grid; grid-template-columns:20px 22px 1fr auto auto; align-items:center; gap:7px; padding:6px 7px; border-radius:var(--r-sm); }
  .po-lr.is-me{ background:var(--accent-soft); box-shadow:inset 2px 0 0 var(--accent); }
  .po-lr.is-zone{ background:var(--elim-soft); } .po-lr.is-elim{ opacity:.55; }
  .po-lr.is-elim .po-lr-name{ text-decoration:line-through; }
  .po-lr-rank{ font-size:11px; font-weight:700; color:var(--text-tertiary); text-align:center; }
  .po-lr-name{ font-size:var(--fs-caption); font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
  .po-lr-pts{ font-size:13px; font-weight:800; font-variant-numeric:tabular-nums; }
  .po-lr svg{ color:var(--elim); }
  .po-col-cut{ display:flex; align-items:center; gap:6px; margin:4px 0; }
  .po-col-cut-line{ flex:1; height:2px; background:repeating-linear-gradient(90deg,var(--elim) 0 6px,transparent 6px 10px); }
  .po-col-cut-lab{ font-size:9px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; color:var(--elim); }
  .po-col-future{ }
