<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="cobalt" data-density="compact">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draft Room — World Cup Fantasy</title>
<link rel="stylesheet" href="ds/ds.css">
<style>
  html,body{ height:100%; }
  #root{ height:100vh; overflow:hidden; }
  .dr{ display:flex; flex-direction:column; height:100vh; background:var(--surface-0); }

  /* Top bar */
  .dr-top{ display:flex; align-items:center; gap:16px; padding:10px 16px; border-bottom:1px solid var(--hairline); background:var(--surface-1); flex:none; }
  .dr-brand{ display:flex; align-items:center; gap:10px; }
  .dr-logo{ width:28px;height:28px;border-radius:7px;background:var(--accent);display:grid;place-items:center;color:var(--text-on-accent);font-family:var(--font-display);font-weight:800; }
  .dr-presence{ display:flex; align-items:center; }
  .dr-presence .avatar{ margin-left:-6px; border:2px solid var(--surface-1); }
  .dr-sim{ display:flex; gap:6px; align-items:center; }

  /* Clock bar */
  .dr-clockbar{ display:flex; align-items:center; gap:16px; padding:12px 18px; background:var(--surface-2); border-bottom:1px solid var(--hairline); flex:none; transition:background var(--dur-base); }
  .dr-clockbar.is-mine{ background:linear-gradient(90deg,var(--accent-soft),transparent 70%); box-shadow:inset 3px 0 0 var(--accent); }
  .dr-clockbar.is-urgent{ background:linear-gradient(90deg,var(--live-soft),transparent 70%); box-shadow:inset 3px 0 0 var(--live); }
  .dr-clk{ font-family:var(--font-mono); font-weight:700; font-size:30px; font-variant-numeric:tabular-nums; line-height:1; }
  .dr-onclock{ display:flex; align-items:center; gap:10px; }

  /* Recent ticker */
  .dr-ticker{ display:flex; gap:8px; padding:8px 16px; overflow-x:auto; border-bottom:1px solid var(--hairline); background:var(--surface-1); flex:none; scrollbar-width:thin; }
  .dr-tick{ display:flex; align-items:center; gap:7px; padding:5px 9px; background:var(--surface-2); border:1px solid var(--hairline); border-radius:var(--r-md); white-space:nowrap; flex:none; animation:tickin var(--dur-slow) var(--ease-out); }
  @keyframes tickin{ from{ opacity:0; transform:translateX(-8px);} to{opacity:1;transform:none;} }

  /* Body split */
  .dr-body{ display:flex; flex:1; min-height:0; }
  .dr-boardwrap{ flex:1; min-width:0; overflow:auto; padding:16px; }
  .dr-rail{ width:380px; flex:none; border-left:1px solid var(--hairline); background:var(--surface-1); display:flex; flex-direction:column; min-height:0; }

  /* Board */
  .dr-board{ display:grid; gap:6px; }
  .dr-colhead{ position:sticky; top:0; z-index:3; display:flex; flex-direction:column; align-items:center; gap:5px; padding:8px 4px; background:var(--surface-1); border:1px solid var(--hairline); border-radius:var(--r-md); }
  .dr-colhead.is-current{ border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
  .dr-colhead.is-me{ background:var(--accent-soft); }
  .dr-cell{ height:50px; padding:5px 8px; border:1px solid var(--hairline); border-radius:var(--r-md); background:var(--surface-2); display:flex; flex-direction:column; justify-content:center; gap:3px; overflow:hidden; }
  .dr-cell .cell-top{ display:flex; align-items:center; gap:5px; }
  .dr-cell .cell-name{ font-weight:700; font-size:12px; line-height:1.15; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .dr-cell.is-empty{ background:var(--surface-1); border-style:dashed; opacity:.5; }
  .dr-cell.is-current{ border-color:var(--accent); background:var(--accent-soft); box-shadow:0 0 0 1px var(--accent); animation:cellpulse 1.6s var(--ease-standard) infinite; }
  @keyframes cellpulse{ 0%,100%{ box-shadow:0 0 0 1px var(--accent);} 50%{ box-shadow:0 0 0 3px var(--accent-soft);} }
  .dr-cell .pk{ font-family:var(--font-mono); font-size:10px; color:var(--text-tertiary); flex:none; margin-left:auto; }
  /* position-tinted board cells: subtle wash + left stripe, name stays dominant */
  .dr-cell.tint-GK{ background:color-mix(in srgb, var(--pos-gk) 13%, var(--surface-2)); box-shadow:inset 3px 0 0 var(--pos-gk); border-color:color-mix(in srgb, var(--pos-gk) 26%, var(--hairline)); }
  .dr-cell.tint-DEF{ background:color-mix(in srgb, var(--pos-def) 13%, var(--surface-2)); box-shadow:inset 3px 0 0 var(--pos-def); border-color:color-mix(in srgb, var(--pos-def) 26%, var(--hairline)); }
  .dr-cell.tint-MID{ background:color-mix(in srgb, var(--pos-mid) 13%, var(--surface-2)); box-shadow:inset 3px 0 0 var(--pos-mid); border-color:color-mix(in srgb, var(--pos-mid) 26%, var(--hairline)); }
  .dr-cell.tint-FWD{ background:color-mix(in srgb, var(--pos-fwd) 13%, var(--surface-2)); box-shadow:inset 3px 0 0 var(--pos-fwd); border-color:color-mix(in srgb, var(--pos-fwd) 26%, var(--hairline)); }
  .dr-rlabel{ display:flex; align-items:center; justify-content:flex-end; padding-right:8px; font-family:var(--font-mono); font-size:11px; color:var(--text-tertiary); }
  .dr-snake{ display:flex; align-items:center; gap:3px; color:var(--text-tertiary); font-size:10px; }

  /* Rail */
  .dr-railhead{ padding:12px 14px 0; flex:none; }
  .dr-railscroll{ flex:1; min-height:0; overflow-y:auto; padding:12px 14px; }
  .dr-search{ position:relative; margin-bottom:10px; }
  .dr-search svg{ position:absolute; left:10px; top:11px; width:16px; height:16px; color:var(--text-tertiary); }
  .dr-search .input{ padding-left:32px; }
  .dr-filters{ display:flex; gap:6px; margin-bottom:6px; flex-wrap:wrap; }
  .dr-prow{ display:flex; align-items:center; gap:9px; padding:8px; border-radius:var(--r-md); border:1px solid var(--hairline); background:var(--surface-2); margin-bottom:7px; transition:background var(--dur-fast); }
  .dr-prow:hover{ background:var(--surface-3); }
  .dr-prow.is-taken{ opacity:.42; }
  .dr-prow .nm{ flex:1; min-width:0; }
  .dr-prow .nm b{ display:block; font-size:var(--fs-sm); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .dr-qitem{ display:flex; align-items:center; gap:8px; padding:8px; border:1px solid var(--hairline); border-radius:var(--r-md); background:var(--surface-2); margin-bottom:6px; cursor:grab; }
  .dr-qitem.drag{ opacity:.4; }
  .dr-qitem .handle{ color:var(--text-tertiary); cursor:grab; display:flex; }
  .dr-needbar{ display:flex; gap:8px; }
  .dr-need{ flex:1; text-align:center; background:var(--surface-2); border:1px solid var(--hairline); border-radius:var(--r-md); padding:8px 4px; }
  .dr-need.done{ border-color:var(--success); }

  /* Lobby + summary overlays */
  .dr-center{ flex:1; display:block; padding:24px; overflow:auto; min-height:0; }
  .dr-center > *{ margin:0 auto; }
  .lobby{ max-width:560px; width:100%; }
  .lobby-order{ display:flex; flex-direction:column; gap:6px; max-height:300px; overflow:auto; }
  .lobby-orow{ display:flex; align-items:center; gap:10px; padding:8px 10px; background:var(--surface-2); border:1px solid var(--hairline); border-radius:var(--r-md); }
  .summary{ max-width:920px; width:100%; }
  .sum-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
  .sum-col h4{ margin-bottom:8px; }

  /* Mobile */
  .dr-mtabs{ display:none; }
  @media (max-width: 960px){
    .dr-rail{ width:100%; border-left:none; border-top:1px solid var(--hairline); }
    .dr-body{ display:block; overflow:auto; }
    .dr-boardwrap{ display:none; }
    .dr-mtabs{ display:flex; gap:2px; padding:6px; background:var(--surface-1); border-bottom:1px solid var(--hairline); }
    .dr-mtabs .tab{ flex:1; }
    .dr.show-board .dr-boardwrap{ display:block; height:auto; }
    .dr.show-board .dr-rail{ display:none; }
    .dr-railhead{ display:none; }
    .dr-sim .lbl-hide{ display:none; }
  }
  ::-webkit-scrollbar{ width:10px; height:10px; } ::-webkit-scrollbar-thumb{ background:var(--surface-4); border-radius:10px; border:2px solid var(--surface-1);} 
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="draft/data.jsx"></script>
<script type="text/babel" src="draft/app.jsx"></script>
</body>
</html>
