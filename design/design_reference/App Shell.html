<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="cobalt" data-density="comfortable">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App Shell — World Cup Fantasy</title>
<link rel="stylesheet" href="ds/ds.css">
<style>
  html,body{ height:100%; } body{ background:var(--surface-0); } #root{ min-height:100vh; }
  :root{ --node-played:#6E86B4; }
  ::-webkit-scrollbar{ width:10px; height:10px; } ::-webkit-scrollbar-thumb{ background:var(--surface-4); border-radius:10px; border:2px solid var(--surface-1);} 
  .db-livedot{ display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--live); animation:livepulse 1.4s var(--ease-standard) infinite; flex:none; }
  .rt-livedot{ display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--live); vertical-align:middle; animation:livepulse 1.4s var(--ease-standard) infinite; }

  /* ============================ STAGE ============================ */
  .vf-stage{ min-height:100vh; display:flex; flex-direction:column; padding:14px 16px 28px; gap:12px; }
  .vf-logo{ width:28px;height:28px;border-radius:7px;background:var(--accent);display:grid;place-items:center;color:var(--text-on-accent);font-family:var(--font-display);font-weight:800; flex:none; }
  .vf-stagebar{ display:flex; align-items:center; gap:16px; flex-wrap:wrap; background:var(--surface-1); border:1px solid var(--hairline); border-radius:var(--r-lg); padding:10px 14px; }
  .vf-sb-title{ display:flex; align-items:center; gap:10px; }
  .vf-sb-sim{ display:flex; align-items:center; gap:8px; }
  .vf-sb-clock{ font-weight:700; font-size:14px; white-space:nowrap; }
  .vf-sb-range{ accent-color:var(--accent); height:4px; }
  .vf-sb-conn{ display:flex; align-items:center; gap:4px; flex-wrap:wrap; }
  .vf-connbtn{ border:1px solid var(--hairline); background:var(--surface-2); color:var(--text-secondary); font:600 11px/1 var(--font-sans); padding:6px 9px; border-radius:var(--r-sm); cursor:pointer; text-transform:capitalize; }
  .vf-connbtn.is-active{ background:var(--accent-soft); border-color:var(--accent); color:var(--text-primary); }
  .db-phasebar{ display:flex; align-items:center; gap:8px; }
  .db-phaseseg{ display:inline-flex; gap:2px; background:var(--surface-2); padding:3px; border-radius:var(--r-md); border:1px solid var(--hairline); }
  .db-phasebtn{ padding:6px 10px; border-radius:var(--r-sm); border:none; background:transparent; color:var(--text-secondary); font:600 12px/1 var(--font-sans); cursor:pointer; white-space:nowrap; }
  .db-phasebtn:hover{ color:var(--text-primary); } .db-phasebtn.is-active{ background:var(--accent); color:var(--text-on-accent); }

  .vf-fit{ flex:1; display:flex; justify-content:center; }
  .vf-frames{ display:flex; gap:28px; align-items:flex-start; transform-origin:top center; flex:none; }
  .vf-browser{ width:1180px; height:980px; border-radius:14px; overflow:hidden; background:var(--surface-1); border:1px solid var(--hairline-strong); box-shadow:var(--e3); display:flex; flex-direction:column; }
  .vf-bw-bar{ height:40px; flex:none; display:flex; align-items:center; gap:8px; padding:0 14px; background:var(--surface-2); border-bottom:1px solid var(--hairline); }
  .vf-bw-dot{ width:11px; height:11px; border-radius:50%; }
  .vf-bw-url{ display:flex; align-items:center; gap:6px; margin-left:10px; background:var(--surface-0); border:1px solid var(--hairline); border-radius:var(--r-pill); padding:5px 12px; font-size:12px; color:var(--text-secondary); }
  .vf-bw-badge{ margin-left:auto; color:var(--text-tertiary); letter-spacing:.04em; }
  .vf-bw-body{ flex:1; min-height:0; }
  .vf-phone{ position:relative; flex:none; }
  .vf-phone-badge{ position:absolute; left:50%; bottom:-22px; transform:translateX(-50%); color:var(--text-tertiary); letter-spacing:.04em; white-space:nowrap; }
  .vf-banner{ display:flex; align-items:center; gap:8px; padding:8px 18px; font-size:var(--fs-sm); flex:none; }
  .vf-banner-recon{ background:var(--info-soft); color:var(--text-primary); }
  .vf-banner-stale{ background:var(--surface-2); color:var(--text-secondary); border-bottom:1px solid var(--hairline); }
  .mvf-banner{ margin:0; padding:8px 14px; font-size:var(--fs-caption); }
  @media (max-width: 860px){ .db-phasebar{ order:3; flex-basis:100%; } }

  /* ============================ desktop app ============================ */
  .db-app{ height:100%; display:flex; flex-direction:column; background:var(--surface-0); }
  .db-top{ display:flex; align-items:center; gap:18px; padding:11px 18px; border-bottom:1px solid var(--hairline); background:var(--surface-1); flex:none; }
  .db-brand{ display:flex; align-items:center; gap:10px; } .db-brand-title{ font-weight:800; font-size:17px; }
  .db-nav{ display:flex; gap:4px; }
  .db-nav-item{ padding:7px 12px; border-radius:var(--r-md); font-size:var(--fs-sm); font-weight:600; color:var(--text-secondary); }
  .db-nav-item:hover{ background:var(--surface-2); color:var(--text-primary); }
  .db-nav-item.is-active{ background:var(--surface-3); color:var(--text-primary); }
  .db-top-spacer{ flex:1; }

  .db-scroll{ flex:1; min-height:0; overflow-y:auto; }
  .db-page{ padding:18px; display:flex; flex-direction:column; gap:16px; }

  /* primary banner */
  .db-banner{ display:flex; align-items:stretch; justify-content:space-between; gap:26px; background:var(--surface-1); border:1px solid var(--hairline); border-radius:var(--r-xl); padding:20px 24px; position:relative; overflow:hidden; box-shadow:inset 4px 0 0 var(--phc); }
  .db-banner-main{ display:flex; flex-direction:column; gap:9px; min-width:0; flex:1; }
  .db-eyebrow{ display:inline-flex; align-items:center; gap:6px; align-self:flex-start; height:24px; padding:0 11px; border-radius:var(--r-pill); font-size:var(--fs-micro); font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--phc); background:color-mix(in srgb, var(--phc) 16%, transparent); }
  .db-eyebrow-dot{ width:6px; height:6px; border-radius:50%; background:var(--phc); }
  .db-banner-title{ font-size:30px; line-height:1.05; font-weight:800; letter-spacing:-.02em; }
  .db-banner-sub{ margin:0; max-width:560px; }
  .db-banner-cta{ display:flex; gap:10px; margin-top:6px; }
  .db-banner-side{ flex:none; display:flex; flex-direction:column; align-items:flex-end; justify-content:space-between; gap:14px; padding-left:24px; border-left:1px solid var(--hairline); }
  .db-banner-big{ font-size:42px; font-weight:800; line-height:1; letter-spacing:-.02em; color:var(--text-primary); }
  .db-banner-secs{ display:flex; gap:18px; }
  .db-bsec{ display:flex; flex-direction:column; gap:2px; align-items:flex-end; white-space:nowrap; } .db-bsec b{ font-size:var(--fs-body-lg); } .db-bsec .t-micro{ white-space:nowrap; }
  .db-banner-router{ padding:30px 32px; } .db-banner-router .db-banner-title{ font-size:38px; } .db-banner-router .db-banner-big{ font-size:54px; }

  /* grid (masonry) */
  .db-grid{ column-count:3; column-gap:14px; }
  .db-grid-cell{ break-inside:avoid; margin-bottom:14px; }
  .db-spotlight{ display:grid; grid-template-columns:1.55fr 1fr; gap:14px; align-items:start; }
  .db-spot-main, .db-spot-rail{ display:flex; flex-direction:column; gap:14px; }
  .db-router{ max-width:880px; margin:0 auto; width:100%; }
  .db-router-mod{ margin-top:2px; }
  .db-router-jump{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding-top:4px; }

  /* module shell */
  .db-mod{ background:var(--surface-1); border:1px solid var(--hairline); border-radius:var(--r-lg); padding:14px 16px; }
  .db-mod-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; }
  .db-mod-cta{ display:inline-flex; align-items:center; gap:4px; font-size:var(--fs-sm); font-weight:600; color:var(--accent); background:none; border:none; cursor:pointer; padding:0; white-space:nowrap; }
  .db-mod-cta:hover{ color:var(--accent-hover); }

  /* record module */
  .db-record{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px; padding-bottom:12px; border-bottom:1px solid var(--hairline); }
  .db-rec-season{ display:flex; flex-direction:column; gap:3px; flex:none; }
  .db-rec-wl{ font-weight:800; font-size:34px; line-height:1; letter-spacing:-.02em; white-space:nowrap; } .db-rec-dash{ color:var(--text-tertiary); margin:0 1px; } .db-rec-d{ color:var(--draw); font-size:22px; }
  .db-rec-split{ display:flex; gap:18px; }
  .db-rec-stat{ display:flex; flex-direction:column; align-items:flex-end; gap:2px; } .db-rec-stat b{ font-size:24px; font-weight:800; line-height:1; }
  .db-rec-prov{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .db-rec-provrec{ font-size:var(--fs-sm); font-weight:700; }

  /* lock module */
  .db-lock{ display:flex; gap:20px; margin-bottom:12px; }
  .db-lock-stat{ display:flex; flex-direction:column; gap:3px; } .db-lock-stat b{ font-size:30px; font-weight:800; line-height:1; }
  .db-lock-stat .t-micro{ display:inline-flex; align-items:center; gap:4px; }
  .db-lock-dl{ font-size:var(--fs-sm); color:var(--text-secondary); padding:8px 10px; background:var(--surface-2); border-radius:var(--r-md); display:flex; align-items:center; gap:6px; }
  .db-lock-dl.is-urgent{ color:var(--live); background:var(--live-soft); }
  .db-lock-dl b{ color:var(--text-primary); }

  /* waiver module */
  .db-faab{ display:flex; flex-direction:column; gap:8px; margin-bottom:12px; }
  .db-faab-row{ display:flex; align-items:baseline; gap:8px; } .db-faab-row b{ font-size:28px; font-weight:800; line-height:1; }
  .db-faab-meta{ display:flex; flex-direction:column; gap:6px; font-size:var(--fs-sm); } .db-faab-meta b{ font-weight:700; }

  /* standings module */
  .db-stand{ display:flex; flex-direction:column; gap:2px; }
  .db-stand-row{ display:grid; grid-template-columns:22px 24px 1fr auto auto; align-items:center; gap:9px; padding:6px 8px; border-radius:var(--r-sm); }
  .db-stand-row.is-me{ background:var(--accent-soft); box-shadow:inset 3px 0 0 var(--accent); }
  .db-stand-rank{ color:var(--text-tertiary); font-size:13px; text-align:center; }
  .db-stand-name{ font-size:var(--fs-sm); font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .db-stand-wl{ font-size:var(--fs-sm); color:var(--text-secondary); white-space:nowrap; }
  .db-stand-pts{ font-size:var(--fs-sm); font-weight:700; min-width:34px; text-align:right; }

  /* fixtures module */
  .db-fix{ display:flex; flex-direction:column; gap:6px; }
  .db-fix-row{ display:grid; grid-template-columns:1fr auto 1fr 46px; align-items:center; gap:8px; }
  .db-fix-team{ display:inline-flex; align-items:center; gap:6px; } .db-fix-row .db-fix-team:last-of-type{ justify-content:flex-end; }
  .db-fix-score{ font-weight:700; font-size:var(--fs-sm); text-align:center; }
  .db-fix-clk{ display:inline-flex; align-items:center; gap:3px; justify-content:flex-end; font-size:11px; font-weight:700; }
  .db-fix-clk.is-live{ color:var(--live); } .db-fix-clk.is-final{ color:var(--text-tertiary); } .db-fix-clk.is-ytp{ color:var(--text-tertiary); }

  /* activity module */
  .db-act{ display:flex; flex-direction:column; }
  .db-act-row{ display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--hairline); }
  .db-act-row:last-child{ border-bottom:none; }
  .db-act-ic{ width:20px; text-align:center; font-size:13px; flex:none; }
  .db-act-txt{ flex:1; font-size:var(--fs-sm); } .db-act-meta{ font-size:var(--fs-caption); }
  .db-act-t{ font-size:11px; }

  /* draft forming + picks */
  .db-forming{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:10px; }
  .db-forming-cell{ display:flex; flex-direction:column; align-items:center; gap:6px; padding:10px 4px; background:var(--surface-2); border:1px solid var(--hairline); border-radius:var(--r-md); }
  .db-forming-cell .mono b{ font-size:18px; }
  .db-picks{ display:flex; flex-direction:column; gap:2px; }
  .db-pick-row{ display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:var(--r-sm); }
  .db-pick-row.is-me{ background:var(--accent-soft); }
  .db-pick-no{ color:var(--text-tertiary); font-size:12px; width:30px; }
  .db-pick-player{ flex:1; font-size:var(--fs-sm); font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .db-pick-by{ font-weight:700; }

  /* bracket */
  .db-bracket{ display:flex; flex-direction:column; gap:4px; }
  .db-br-row{ display:flex; align-items:center; gap:9px; padding:8px 9px; border-radius:var(--r-md); background:var(--surface-2); border:1px solid var(--hairline); }
  .db-br-row.is-me{ box-shadow:inset 3px 0 0 var(--accent); border-color:var(--accent); }
  .db-br-row.is-risk{ background:var(--elim-soft); border-color:color-mix(in srgb,var(--elim) 40%, var(--hairline)); }
  .db-br-seed{ width:18px; color:var(--text-tertiary); font-size:13px; text-align:center; }
  .db-br-name{ flex:1; font-size:var(--fs-sm); font-weight:600; }
  .db-br-pts{ font-weight:700; font-size:var(--fs-sm); }
  .db-br-tag{ margin-left:4px; }
  .db-br-foot{ margin-top:4px; }

  /* podium + recap */
  .db-podium{ display:flex; flex-direction:column; gap:6px; }
  .db-pod-row{ display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:var(--r-md); background:var(--surface-2); border:1px solid var(--hairline); }
  .db-pod-row.is-champ{ background:color-mix(in srgb,var(--win) 12%, var(--surface-2)); border-color:color-mix(in srgb,var(--win) 35%, var(--hairline)); }
  .db-pod-row.is-me{ box-shadow:inset 3px 0 0 var(--accent); }
  .db-pod-medal{ font-size:18px; width:24px; text-align:center; }
  .db-pod-name{ flex:1; font-weight:600; font-size:var(--fs-sm); } .db-pod-pts{ font-weight:700; }
  .db-myrecap{ display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
  .db-myrec-stat{ display:flex; flex-direction:column; gap:3px; padding:10px 12px; background:var(--surface-2); border-radius:var(--r-md); } .db-myrec-stat b{ font-size:22px; font-weight:800; line-height:1; }

  /* info + readiness */
  .db-info{ display:flex; flex-direction:column; gap:8px; }
  .db-info-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; font-size:var(--fs-sm); padding-bottom:8px; border-bottom:1px solid var(--hairline); } .db-info-row:last-child{ border-bottom:none; padding-bottom:0; }
  .db-info-row b{ font-weight:600; text-align:right; }
  .db-ready{ display:grid; grid-template-columns:repeat(2,1fr); gap:6px; }
  .db-ready-chip{ display:flex; align-items:center; gap:7px; padding:6px 9px; background:var(--surface-2); border:1px solid var(--hairline); border-radius:var(--r-pill); }
  .db-ready-name{ flex:1; font-size:var(--fs-caption); font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .db-ready-dot{ width:8px; height:8px; border-radius:50%; background:var(--text-tertiary); flex:none; } .db-ready-dot.is-ready{ background:var(--success); }

  /* ============================ mobile ============================ */
  .mdb{ min-height:100%; background:var(--surface-0); color:var(--text-primary); font-family:var(--font-sans); }
  .mdb-head{ position:sticky; top:0; z-index:8; background:var(--surface-0); padding:46px 14px 12px; border-bottom:1px solid var(--hairline); }
  .mdb-headrow{ display:flex; align-items:center; justify-content:space-between; }
  .mdb-scroll{ padding:12px; display:flex; flex-direction:column; gap:12px; }
  .mdb .db-banner{ flex-direction:column; align-items:stretch; gap:14px; padding:16px; }
  .mdb .db-banner-side{ flex-direction:row; align-items:center; justify-content:space-between; border-left:none; border-top:1px solid var(--hairline); padding-left:0; padding-top:12px; }
  .mdb .db-banner-title{ font-size:24px; }
  .mdb-nav{ display:flex; flex-wrap:wrap; gap:8px; margin-top:2px; }

  [data-density="comfortable"] .db-stand-row{ padding-top:8px; padding-bottom:8px; }

  /* ============================ PHASE 5 — APP SHELL chrome ============================ */
  .sh-app{ height:100%; background:var(--surface-0); color:var(--text-primary); }
  .sh-brand{ display:flex; align-items:center; gap:10px; text-decoration:none; color:inherit; }
  .sh-brand-txt{ display:flex; flex-direction:column; line-height:1.05; } .sh-brand-txt b{ font-size:15px; font-weight:800; color:var(--text-primary); }
  .sh-pop-scrim{ position:fixed; inset:0; z-index:20; }

  /* --- sidebar mode --- */
  .sh-app-side{ display:flex; }
  .sh-side{ width:240px; flex:none; background:var(--surface-1); border-right:1px solid var(--hairline); display:flex; flex-direction:column; padding:16px 12px; gap:6px; }
  .sh-side .sh-brand{ padding:4px 8px 10px; }
  .sh-side-scroll{ flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column; gap:2px; }
  .sh-side-label{ padding:14px 10px 5px; text-transform:uppercase; letter-spacing:.07em; font-weight:700; }
  .sh-side-group{ display:flex; flex-direction:column; gap:2px; }
  .sh-side-item{ display:flex; align-items:center; gap:11px; padding:9px 11px; border-radius:var(--r-md); color:var(--text-secondary); font-size:var(--fs-sm); font-weight:600; text-decoration:none; position:relative; }
  .sh-side-item:hover{ background:var(--surface-2); color:var(--text-primary); }
  .sh-side-item.is-active{ background:var(--accent-soft); color:var(--text-primary); box-shadow:inset 3px 0 0 var(--accent); }
  .sh-side-item svg{ flex:none; opacity:.82; }
  .sh-side-item.is-active svg{ color:var(--accent); opacity:1; }
  .sh-side-item.is-commish{ color:var(--locked); }
  .sh-side-item.is-commish svg{ color:var(--locked); }
  .sh-side-item.is-commish:hover{ background:color-mix(in srgb,var(--locked) 14%, transparent); color:var(--text-primary); }
  .sh-side-foot{ border-top:1px solid var(--hairline); padding-top:10px; margin-top:4px; }
  .sh-commish-dot{ margin-left:auto; width:7px; height:7px; border-radius:50%; background:var(--locked); flex:none; }
  .sh-main{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .sh-content{ flex:1; min-height:0; overflow-y:auto; }
  .sh-chead{ display:flex; align-items:center; justify-content:space-between; gap:16px; padding:12px 18px; border-bottom:1px solid var(--hairline); background:var(--surface-1); flex:none; }
  .sh-chead-l{ display:flex; align-items:baseline; gap:10px; min-width:0; }
  .sh-chead-title{ font-size:19px; font-weight:800; }

  /* --- top-bar mode --- */
  .sh-app-top{ display:flex; flex-direction:column; }
  .sh-topbar{ display:flex; align-items:center; gap:16px; padding:10px 18px; border-bottom:1px solid var(--hairline); background:var(--surface-1); flex:none; }
  .sh-topbar .sh-brand-txt span{ display:none; } .sh-topbar .sh-brand-txt b{ font-size:14px; white-space:nowrap; }
  .sh-topnav{ display:flex; align-items:center; gap:2px; }
  .sh-nav-item{ display:flex; align-items:center; gap:6px; padding:7px 9px; border-radius:var(--r-md); color:var(--text-secondary); font-size:13px; font-weight:600; text-decoration:none; border:none; background:none; cursor:pointer; white-space:nowrap; }
  .sh-nav-item svg{ opacity:.78; flex:none; }
  .sh-nav-item:hover{ background:var(--surface-2); color:var(--text-primary); }
  .sh-nav-item.is-active{ background:var(--surface-3); color:var(--text-primary); }
  .sh-nav-item.is-active svg{ color:var(--accent); opacity:1; }
  .sh-top-r{ margin-left:auto; display:flex; align-items:center; gap:12px; }

  /* More dropdown */
  .sh-more{ position:relative; }
  .sh-more-pop{ position:absolute; top:calc(100% + 6px); right:0; z-index:30; min-width:236px; background:var(--surface-1); border:1px solid var(--hairline-strong); border-radius:var(--r-lg); box-shadow:var(--e3); padding:6px; display:flex; flex-direction:column; gap:1px; }
  .sh-more-item{ display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:var(--r-md); color:var(--text-secondary); font-size:var(--fs-sm); font-weight:600; text-decoration:none; }
  .sh-more-item:hover{ background:var(--surface-2); color:var(--text-primary); }
  .sh-more-item.is-active{ background:var(--surface-3); color:var(--text-primary); }
  .sh-more-item svg{ flex:none; opacity:.8; }
  .sh-more-item.is-commish{ color:var(--locked); } .sh-more-item.is-commish svg{ color:var(--locked); }
  .sh-commish-tag{ margin-left:auto; font-size:9px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; color:var(--locked); background:color-mix(in srgb,var(--locked) 18%, transparent); padding:2px 6px; border-radius:var(--r-pill); white-space:nowrap; }

  /* bell */
  .sh-bell{ position:relative; width:38px; height:38px; border-radius:var(--r-md); border:1px solid var(--hairline); background:var(--surface-2); color:var(--text-secondary); cursor:pointer; display:grid; place-items:center; text-decoration:none; flex:none; }

  .sh-bell-badge{ position:absolute; top:-6px; right:-6px; min-width:18px; height:18px; padding:0 5px; border-radius:var(--r-pill); background:var(--live); color:#fff; font-size:10px; font-weight:800; display:grid; place-items:center; border:2px solid var(--surface-1); }

  /* avatar menu */
  .sh-amenu{ position:relative; }
  .sh-amenu-trig{ display:flex; align-items:center; gap:8px; padding:4px 9px 4px 4px; border-radius:var(--r-pill); border:1px solid var(--hairline); background:var(--surface-2); cursor:pointer; color:var(--text-primary); }
  .sh-amenu-trig:hover{ border-color:var(--hairline-strong); }
  .sh-amenu-trig.is-open{ border-color:var(--accent); background:var(--accent-soft); }
  .sh-amenu-name{ font-size:var(--fs-sm); font-weight:600; max-width:90px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sh-amenu-pop{ position:absolute; top:calc(100% + 6px); right:0; z-index:30; min-width:226px; background:var(--surface-1); border:1px solid var(--hairline-strong); border-radius:var(--r-lg); box-shadow:var(--e3); padding:8px; }
  .sh-amenu-id{ display:flex; align-items:center; gap:10px; padding:6px 8px 10px; }
  .sh-amenu-idtxt{ display:flex; flex-direction:column; gap:2px; } .sh-amenu-idtxt b{ font-size:var(--fs-body); }
  .sh-amenu-sep{ height:1px; background:var(--hairline); margin:2px 0 6px; }
  .sh-amenu-item{ display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:var(--r-md); color:var(--text-secondary); font-size:var(--fs-sm); font-weight:600; text-decoration:none; }
  .sh-amenu-item:hover{ background:var(--surface-2); color:var(--text-primary); }
  .sh-amenu-item.is-danger{ color:var(--danger); } .sh-amenu-item.is-danger:hover{ background:var(--danger-soft); }
  .sh-amenu-item.is-commish{ color:var(--locked); }
  .sh-amenu-item svg{ flex:none; opacity:.8; }

  /* ============================ mobile shell ============================ */
  .msh{ height:100%; background:var(--surface-0); color:var(--text-primary); font-family:var(--font-sans); display:flex; flex-direction:column; position:relative; }
  .msh-head{ background:var(--surface-0); padding:46px 14px 12px; border-bottom:1px solid var(--hairline); display:flex; align-items:center; justify-content:space-between; gap:10px; flex:none; }
  .msh-head .sh-brand b{ color:var(--text-primary); }
  .msh-head-r{ display:flex; align-items:center; gap:10px; }
  .msh-scroll{ flex:1; min-height:0; overflow-y:auto; padding:12px 12px 92px; display:flex; flex-direction:column; gap:12px; }
  .msh .db-banner{ flex-direction:column; align-items:stretch; gap:14px; padding:16px; }
  .msh .db-banner-side{ flex-direction:row; align-items:center; justify-content:space-between; border-left:none; border-top:1px solid var(--hairline); padding-left:0; padding-top:12px; }
  .msh .db-banner-title{ font-size:23px; }

  .sh-tabbar{ position:absolute; left:0; right:0; bottom:0; z-index:30; display:flex; background:color-mix(in srgb,var(--surface-1) 94%, transparent); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-top:1px solid var(--hairline); padding:8px 6px 26px; }
  .sh-tab{ flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:4px 2px; background:none; border:none; cursor:pointer; color:var(--text-tertiary); font-size:10px; font-weight:600; text-decoration:none; }
  .sh-tab svg{ opacity:.9; }
  .sh-tab.is-active{ color:var(--accent); }

  .sh-sheet-wrap{ position:absolute; inset:0; z-index:40; background:rgba(0,0,0,.45); display:flex; align-items:flex-end; }
  .sh-sheet{ width:100%; background:var(--surface-1); border-top-left-radius:22px; border-top-right-radius:22px; border-top:1px solid var(--hairline-strong); padding:10px 14px 34px; max-height:82%; overflow-y:auto; box-shadow:0 -16px 40px rgba(0,0,0,.3); }
  .sh-sheet-grab{ width:38px; height:4px; border-radius:4px; background:var(--surface-4); margin:2px auto 12px; }
  .sh-sheet-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; } .sh-sheet-head b{ font-size:18px; }
  .sh-sheet-x{ width:30px; height:30px; border-radius:50%; border:none; background:var(--surface-2); color:var(--text-secondary); cursor:pointer; font-size:13px; }
  .sh-sheet-list{ display:flex; flex-direction:column; gap:6px; }
  .sh-sheet-item{ display:flex; align-items:center; gap:12px; padding:11px 12px; border-radius:var(--r-lg); background:var(--surface-2); color:var(--text-primary); text-decoration:none; }
  .sh-sheet-item:active{ background:var(--surface-3); }
  .sh-sheet-ic{ width:40px; height:40px; border-radius:var(--r-md); background:var(--surface-3); display:grid; place-items:center; flex:none; color:var(--text-secondary); }
  .sh-sheet-txt{ flex:1; display:flex; flex-direction:column; gap:1px; min-width:0; } .sh-sheet-txt b{ font-size:var(--fs-body); font-weight:600; }
  .sh-sheet-item.is-commish .sh-sheet-ic{ color:var(--locked); }
</style>
